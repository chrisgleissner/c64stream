name: c64script-fuzz

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * 0"

jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          : Install dependencies
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            clang \
            llvm \
            cmake \
            ninja-build \
            libobs-dev \
            libcurl4-openssl-dev \
            libsimde-dev

      - name: Validate script exists
        run: |
          : Validate fuzz script exists
          echo "PWD: $(pwd)"
          ls -la tests/script/fuzz/fuzz.sh
          test -x tests/script/fuzz/fuzz.sh || { echo "ERROR: fuzz.sh is not executable"; exit 1; }

      - name: Run fuzzing
        continue-on-error: true
        env:
          FUZZ_TIME_SECONDS: "14400"
          FUZZ_JOBS: "2"
        run: ./tests/script/fuzz/fuzz.sh

      - name: Upload fuzz results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c64script-fuzz-${{ github.run_id }}
          path: tests/script/fuzz/results
          if-no-files-found: warn

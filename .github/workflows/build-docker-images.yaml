name: Build Docker Images

on:
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force rebuild even if image exists'
        required: false
        default: false
        type: boolean
  schedule:
    # Rebuild monthly on first day at 02:00 UTC for security updates
    - cron: '0 2 1 * *'
  push:
    branches:
      - main
      - develop
    paths:
      - '.github/docker/**'
      - 'buildspec.json'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/ubuntu-build

jobs:
  build-ubuntu-image:
    name: Build Ubuntu Build Image 🐳
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
      image-tag: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout Repository 📥
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx 🔧
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry 🔑
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata 🏷️
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value={{date 'YYYY-MM-DD'}},enable={{is_default_branch}}
            type=sha,prefix={{branch}}-{{date 'YYYY-MM-DD'}}-

      - name: Build and push Docker image 🚀
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: .github/docker/Dockerfile.ubuntu-build
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1

      - name: Verify Image 🔍
        run: |
          : Verify Image 🔍
          echo "Built image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          echo "Image digest: ${{ steps.build.outputs.digest }}"

          # Test that the image works correctly
          docker run --rm ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            bash -c "obs --version && cmake --version && ninja --version"

  test-image:
    name: Test Docker Image 🧪
    needs: build-ubuntu-image
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.build-ubuntu-image.outputs.image-tag }}

    steps:
      - name: Checkout Repository 📥
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Test Build in Container 🔧
        run: |
          : Test Build in Container 🔧
          # Quick test build to ensure container works
          cmake --preset ubuntu-x86_64
          cmake --build build_x86_64 --parallel

      - name: Verify Plugin Built 🎯
        run: |
          : Verify Plugin Built 🎯
          if [[ -f "build_x86_64/c64stream.so" ]]; then
            echo "✅ Plugin built successfully in container"
            ls -la build_x86_64/c64stream.so
          else
            echo "❌ Plugin build failed"
            exit 1
          fi

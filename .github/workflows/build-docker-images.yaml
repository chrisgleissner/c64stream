name: Build Docker Images

on:
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force rebuild even if no changes detected'
        required: false
        default: false
        type: boolean
  schedule:
    # Rebuild monthly for security updates (1st of each month at 2 AM UTC)
    - cron: '0 2 1 * *'
  push:
    branches:
      - main
      - develop
    paths:
      - '.github/docker/**'
      - 'buildspec.json'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-ubuntu-image:
    name: Build Ubuntu Build Image 🐳
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
      image-tag: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout repository 📥
        uses: actions/checkout@v4

      - name: Log in to Container Registry 🔐
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx 🏗️
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata 📋
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/ubuntu-build
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=latest,enable={{is_default_branch}}
            type=schedule,pattern={{date 'YYYYMMDD'}}
            type=sha

      - name: Build and push Docker image 🚀
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./.github/docker/Dockerfile.ubuntu-build
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate artifact attestation 📜
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/ubuntu-build
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  test-ubuntu-image:
    name: Test Ubuntu Build Image 🧪
    runs-on: ubuntu-latest
    needs: build-ubuntu-image
    container:
      image: ${{ needs.build-ubuntu-image.outputs.image-tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository 📥
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Test build environment 🔍
        run: |
          echo "Testing build tools..."
          cmake --version
          ninja --version
          obs --version
          ccache --version
          
          echo "Testing Qt6 installation..."
          pkg-config --exists Qt6Core && echo "✅ Qt6Core found"
          pkg-config --exists Qt6Widgets && echo "✅ Qt6Widgets found" 
          pkg-config --exists Qt6Svg && echo "✅ Qt6Svg found"
          
          echo "Testing OBS Studio headers..."
          if [ -f "/usr/include/obs/obs.h" ]; then
            echo "✅ OBS headers found"
          else
            echo "❌ OBS headers missing"
            exit 1
          fi

      - name: Test plugin build 🔨
        run: |
          echo "Building plugin to verify container works..."
          cmake --preset ubuntu-x86_64
          cmake --build build_x86_64
          
          if [ -f "build_x86_64/c64stream.so" ]; then
            echo "✅ Plugin built successfully"
            ls -la build_x86_64/c64stream.so
          else
            echo "❌ Plugin build failed"
            exit 1
          fi

  summary:
    name: Build Summary 📊
    runs-on: ubuntu-latest
    needs: [build-ubuntu-image, test-ubuntu-image]
    if: always()
    steps:
      - name: Summary
        run: |
          echo "## Docker Image Build Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.build-ubuntu-image.result }}" == "success" ]; then
            echo "✅ **Ubuntu Build Image**: Built successfully" >> $GITHUB_STEP_SUMMARY
            echo "   - Image: ${{ needs.build-ubuntu-image.outputs.image-tag }}" >> $GITHUB_STEP_SUMMARY
            echo "   - Digest: \`${{ needs.build-ubuntu-image.outputs.image-digest }}\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Ubuntu Build Image**: Build failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ needs.test-ubuntu-image.result }}" == "success" ]; then
            echo "✅ **Container Test**: All tests passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Container Test**: Tests failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Performance Impact**: Using this container should reduce Ubuntu build time from ~4.5min to ~1-2min (60-75% improvement)" >> $GITHUB_STEP_SUMMARY
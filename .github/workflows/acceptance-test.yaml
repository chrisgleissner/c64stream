name: Acceptance Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  acceptance-test:
    name: Run Acceptance Tests
    runs-on: ubuntu-24.04
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Install System Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            ccache \
            zsh \
            xvfb \
            python3 \
            python3-pip \
            python3-numpy
      
      - name: Build Plugin
        run: |
          .github/scripts/build-ubuntu --target ubuntu-x86_64 --config RelWithDebInfo
      
      - name: Build Acceptance Test Tools
        run: |
          cd build_x86_64
          cmake --build . --target udp_replay
      
      - name: Generate Test Packets
        run: |
          cd tests/acceptance
          ./generate_packets.py --frames 10 --format PAL --output test_packets
          ls -lh test_packets/video/PAL/ | head -5
          ls -lh test_packets/audio/PAL/ | head -5
      
      - name: Test UDP Replay Tool
        run: |
          cd tests/acceptance
          # Quick test to ensure UDP replay works
          ../../build_x86_64/tests/acceptance/udp_replay \
            test_packets/video/PAL 127.0.0.1 11000 780 --verbose
      
      - name: Upload Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-test-artifacts
          path: |
            tests/acceptance/test_packets/**/*.bin
            tests/acceptance/test_output/**/*
          retention-days: 7
      
      - name: Test Summary
        run: |
          echo "## Acceptance Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Plugin build successful" >> $GITHUB_STEP_SUMMARY
          echo "✅ UDP replay tool built and tested" >> $GITHUB_STEP_SUMMARY
          echo "✅ Test packets generated successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Test Configuration" >> $GITHUB_STEP_SUMMARY
          echo "- Format: PAL" >> $GITHUB_STEP_SUMMARY
          echo "- Frames: 10" >> $GITHUB_STEP_SUMMARY
          echo "- Video Packets: 680" >> $GITHUB_STEP_SUMMARY
          echo "- Audio Packets: 10" >> $GITHUB_STEP_SUMMARY

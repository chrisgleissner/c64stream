name: "Copilot Setup Steps"

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install dependencies needed by llvm.sh
        run: |
          sudo apt-get update -y
          sudo apt-get install -y wget gnupg lsb-release software-properties-common

      - name: Install Clang 21 toolchain
        run: |
          curl -sSL https://apt.llvm.org/llvm.sh | sudo bash -s -- 21

      - name: Prefer Clang 21 binaries
        run: |
          for tool in clang clang++ clang-format clangd; do
            sudo update-alternatives --install /usr/bin/${tool} ${tool} /usr/bin/${tool}-21 2100 --force
          done
          sudo update-alternatives --set clang /usr/bin/clang-21
          sudo update-alternatives --set clang++ /usr/bin/clang++-21
          sudo update-alternatives --set clang-format /usr/bin/clang-format-21
          sudo update-alternatives --set clangd /usr/bin/clangd-21

      - name: Report selected clang version
        run: |
          clang --version
          clang-format --version

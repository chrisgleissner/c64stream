name: Containerized Build

on:
  workflow_call:
    outputs:
      pluginName:
        description: Project name detected by parsing build spec file
        value: ${{ jobs.containerized-build.outputs.pluginName }}
      pluginVersion:
        description: Project version detected by parsing build spec file  
        value: ${{ jobs.containerized-build.outputs.pluginVersion }}
  pull_request:
    paths:
      - '**.c'
      - '**.h' 
      - '**.cpp'
      - '**.hpp'
      - '**.cmake'
      - '**/CMakeLists.txt'
      - 'buildspec.json'
      - '.github/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/ubuntu-build

jobs:
  containerized-build:
    name: Fast Ubuntu Build 🐧🐳
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}/ubuntu-build:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      pluginName: ${{ steps.setup.outputs.pluginName }}
      pluginVersion: ${{ steps.setup.outputs.pluginVersion }}  
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository 📥
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up environment 🔧
        id: setup
        run: |
          if [[ "${RUNNER_DEBUG}" ]]; then set -x; fi
          
          # Extract plugin information
          product_name=$(jq -r '.name' buildspec.json)
          
          # Detect version based on context
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            plugin_version=$(jq -r '.version' buildspec.json)
          else
            # For non-PR builds, use git tag detection
            git_version_tag=$(git describe --tags --always --dirty 2>/dev/null || echo "")
            if [[ "${git_version_tag}" =~ ^v?([0-9]+\.[0-9]+\.[0-9]+) ]]; then
              plugin_version=$(echo "${git_version_tag}" | sed -E 's/^v?([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
            else
              plugin_version=$(jq -r '.version' buildspec.json)
            fi
          fi
          
          echo "pluginName=${product_name}" >> $GITHUB_OUTPUT
          echo "pluginVersion=${plugin_version}" >> $GITHUB_OUTPUT
          
          echo "🔧 Building ${product_name} v${plugin_version}"

      - name: Set up ccache 🗄️
        uses: actions/cache@v4
        with:
          path: /workspace/.ccache
          key: containerized-ccache-${{ github.sha }}
          restore-keys: |
            containerized-ccache-

      - name: Configure build environment 📋
        run: |
          # Configure ccache
          export CCACHE_DIR=/workspace/.ccache
          export CCACHE_MAXSIZE=200M
          export CMAKE_BUILD_PARALLEL_LEVEL=$(nproc)
          
          # Store in GitHub environment for subsequent steps
          echo "CCACHE_DIR=/workspace/.ccache" >> $GITHUB_ENV
          echo "CCACHE_MAXSIZE=200M" >> $GITHUB_ENV  
          echo "CMAKE_BUILD_PARALLEL_LEVEL=$(nproc)" >> $GITHUB_ENV
          
          echo "🔧 Build environment configured"
          echo "   - CPUs: $(nproc)"
          echo "   - ccache: $CCACHE_MAXSIZE"

      - name: Build plugin 🔨
        run: |
          echo "🔨 Building C64 Stream plugin..."
          
          # Configure the build
          cmake --preset ubuntu-x86_64
          
          # Build the plugin  
          cmake --build build_x86_64 --config RelWithDebInfo
          
          # Verify build success
          if [ -f "build_x86_64/c64stream.so" ]; then
            echo "✅ Plugin built successfully"
            ls -la build_x86_64/c64stream.so
          else
            echo "❌ Plugin build failed"
            exit 1
          fi

      - name: Package plugin 📦
        run: |
          echo "📦 Packaging plugin..."
          
          # Create release directory
          mkdir -p release
          
          # Package the plugin
          cd build_x86_64
          cpack -C RelWithDebInfo
          
          # Move packages to release directory
          mv *.tar.gz ../release/ 2>/dev/null || true
          mv *.deb ../release/ 2>/dev/null || true
          mv *.rpm ../release/ 2>/dev/null || true
          
          # List what was created
          echo "📦 Packaged files:"
          ls -la ../release/

      - name: Upload build artifacts 📤
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.setup.outputs.pluginName }}-${{ steps.setup.outputs.pluginVersion }}-ubuntu-containerized-${{ github.sha }}
          path: release/

      - name: Build summary 📊
        run: |
          echo "## Containerized Build Results 🐳" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Plugin**: ${{ steps.setup.outputs.pluginName }} v${{ steps.setup.outputs.pluginVersion }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Container**: ghcr.io/${{ github.repository }}/ubuntu-build:latest" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Time**: Significantly faster than traditional VM builds" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Show ccache stats if available
          if command -v ccache >/dev/null 2>&1; then
            echo "### ccache Statistics 📈" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            ccache -s >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
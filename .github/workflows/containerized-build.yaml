name: Containerized Build

on:
  workflow_call:
    outputs:
      pluginName:
        description: Project name detected by parsing build spec file
        value: ${{ jobs.containerized-ubuntu-build.outputs.pluginName }}
      pluginVersion:
        description: Project version detected by parsing build spec file  
        value: ${{ jobs.containerized-ubuntu-build.outputs.pluginVersion }}

jobs:
  containerized-ubuntu-build:
    name: Ubuntu Build (Containerized) 🐧🐳
    runs-on: ubuntu-24.04
    # No pre-built container - we'll use Docker build with multi-stage
    outputs:
      pluginName: ${{ steps.setup.outputs.pluginName }}
      pluginVersion: ${{ steps.setup.outputs.pluginVersion }}
      commitHash: ${{ steps.setup.outputs.commitHash }}
      success: ${{ steps.build.outputs.success }}
    
    steps:
      - name: Checkout Repository 📥
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set Up Environment 🔧
        id: setup
        run: |
          : Set Up Environment 🔧
          if [[ "${RUNNER_DEBUG}" ]]; then set -x; fi

          # Extract project info
          read -r product_name product_version <<< \
            "$(jq -r '. | {name, version} | join(" ")' buildspec.json)"

          echo "pluginName=${product_name}" >> $GITHUB_OUTPUT
          echo "pluginVersion=${product_version}" >> $GITHUB_OUTPUT
          echo "commitHash=${GITHUB_SHA:0:9}" >> $GITHUB_OUTPUT

          echo "🔧 Building ${product_name} v${product_version}"

      - name: Set up Docker Buildx 🔧
        uses: docker/setup-buildx-action@v3

      - name: Build Plugin with Docker 🧱
        id: build
        run: |
          : Build Plugin with Docker 🧱
          
          # Use multi-stage Docker build that automatically builds the environment if needed
          docker build -f .github/docker/Dockerfile.multi-stage --target plugin-build -t c64stream-build .
          
          # Extract the built plugin from the container
          docker run --rm -v "$(pwd):/output" c64stream-build bash -c "
            cp /workspace/build_x86_64/c64stream.so /output/ 2>/dev/null || 
            cp /workspace/build*/c64stream.so /output/ 2>/dev/null || 
            cp /workspace/*/c64stream.so /output/ 2>/dev/null || 
            (echo 'Plugin not found in expected locations:' && find /workspace -name 'c64stream.so' -type f)
          "
          
          # Verify the plugin was extracted
          if [[ -f "c64stream.so" ]]; then
            echo "✅ Plugin built successfully"
            echo "success=true" >> $GITHUB_OUTPUT
            
            # Create proper build structure for packaging
            mkdir -p build_x86_64
            cp c64stream.so build_x86_64/
          else
            echo "❌ Plugin build failed - file not found"
            exit 1
          fi

      - name: Package Plugin �
        run: |
          : Package Plugin 📦
          
          # Create a simple tarball package since we have the plugin binary
          mkdir -p release
          
          product_name_version=$(jq -r '. | {name, version} | join(" ")' buildspec.json)
          read -r product_name product_version <<< "${product_name_version}"
          
          # Create tarball
          tar -czf "release/${product_name}-${product_version}-x86_64-containerized.tar.gz" -C build_x86_64 c64stream.so
          
          echo "📦 Created package: release/${product_name}-${product_version}-x86_64-containerized.tar.gz"

      - name: Prepare Artifacts 📋
        run: |
          : Prepare Artifacts 📋
          mkdir -p release

          # Move artifacts to release directory
          if [[ -f build_x86_64/*.tar.xz ]]; then
            mv build_x86_64/*.tar.xz release/
          fi
          if [[ -f build_x86_64/*.deb ]]; then
            mv build_x86_64/*.deb release/
          fi
          if [[ -f build_x86_64/*.ddeb ]]; then
            mv build_x86_64/*.ddeb release/
          fi

          # List what we built
          echo "📦 Built artifacts:"
          ls -la release/ || echo "No release artifacts found"
          ls -la build_x86_64/ | grep -E '\.(so|tar\.gz)$' || echo "No build artifacts found"

      - name: Upload Plugin Binary 📤
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.setup.outputs.pluginName }}-${{ steps.setup.outputs.pluginVersion }}-ubuntu-24.04-x86_64-${{ steps.setup.outputs.commitHash }}
          path: |
            build_x86_64/c64stream.so
            release/*x86_64*.tar.gz
          if-no-files-found: error

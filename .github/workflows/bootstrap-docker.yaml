name: Bootstrap Docker Image

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for building Docker image'
        required: false
        default: 'Initial bootstrap or manual refresh'

jobs:
  build-bootstrap-image:
    name: Bootstrap Ubuntu Build Image 🐳
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout Repository 📥
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx 🔧
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry 🔑
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image 🚀
        uses: docker/build-push-action@v5
        with:
          context: .
          file: .github/docker/Dockerfile.ubuntu-build
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}/ubuntu-build:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify Image 🔍
        run: |
          echo "✅ Bootstrap image built and pushed successfully"
          echo "Image: ghcr.io/${{ github.repository }}/ubuntu-build:latest"
          echo "Future builds will automatically use this image"
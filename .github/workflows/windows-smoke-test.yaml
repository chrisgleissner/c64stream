name: Windows Smoke Test (Reusable)

on:
  workflow_call:
    inputs:
      arch:
        description: 'Architecture (x64 or arm64)'
        required: true
        type: string
      artifact-pattern:
        description: 'Artifact pattern to download'
        required: true
        type: string
      runner:
        description: 'GitHub runner to use'
        required: true
        type: string
      obs-version:
        description: 'OBS Studio version'
        required: true
        type: string

jobs:
  smoke-test:
    name: Windows ${{ inputs.arch }} Smoke Test 💨
    runs-on: ${{ inputs.runner }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Download Plugin Artifact 📥
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ inputs.artifact-pattern }}
          path: artifacts

      - name: Extract Plugin 📦
        run: |
          $artifact = Get-ChildItem -Path artifacts -Filter "*.zip" -Recurse | Select-Object -First 1
          Expand-Archive -Path $artifact.FullName -DestinationPath plugin -Force

      - name: Install OBS Studio 🎥
        run: |
          # Download OBS Studio
          $obsVersion = "${{ inputs.obs-version }}"

          if ("${{ inputs.arch }}" -eq "arm64") {
            # ARM64: Download and extract zip (no installer available)
            $obsUrl = "https://github.com/obsproject/obs-studio/releases/download/${obsVersion}/OBS-Studio-${obsVersion}-Windows-arm64.zip"
            Invoke-WebRequest -Uri $obsUrl -OutFile obs.zip

            # Extract to Program Files
            Expand-Archive -Path obs.zip -DestinationPath "${env:ProgramFiles}\obs-studio" -Force
          } else {
            # x64: Use installer
            $obsUrl = "https://github.com/obsproject/obs-studio/releases/download/${obsVersion}/OBS-Studio-${obsVersion}-Windows-x64-Installer.exe"
            Invoke-WebRequest -Uri $obsUrl -OutFile obs-installer.exe

            # Install OBS silently
            Start-Process -FilePath obs-installer.exe -ArgumentList "/S" -Wait
          }

          # Wait for installation to complete
          Start-Sleep -Seconds 10

      - name: Install Plugin 🔌
        run: |
          $obsPluginPath = "${env:ProgramFiles}\obs-studio\obs-plugins\64bit"
          $obsDataPath = "${env:ProgramFiles}\obs-studio\data\obs-plugins"

          # Create directories if they don't exist
          New-Item -ItemType Directory -Force -Path $obsPluginPath
          New-Item -ItemType Directory -Force -Path $obsDataPath

          # Copy plugin DLL
          Copy-Item -Path "plugin\c64stream\bin\64bit\c64stream.dll" -Destination $obsPluginPath -Force

          # Copy data directory
          if (Test-Path "plugin\c64stream\data") {
            Copy-Item -Path "plugin\c64stream\data" -Destination "${obsDataPath}\c64stream" -Recurse -Force
          }

      - name: Test Plugin Load 🧪
        run: |
          # Launch OBS with verbose logging
          $obsPath = "${env:ProgramFiles}\obs-studio\bin\64bit\obs64.exe"
          $obsConfig = Join-Path $env:APPDATA "obs-studio"
          $obsLogs = Join-Path $obsConfig "logs"

          # Create OBS config and logs directory
          New-Item -ItemType Directory -Force -Path $obsLogs | Out-Null

          # Start OBS asynchronously in background
          Write-Output "Starting OBS..."
          $obsProcess = Start-Process -FilePath $obsPath -ArgumentList "--verbose", "--minimize-to-tray", "--disable-shutdown-check" -PassThru

          # Wait for OBS to create its log file (OBS generates the filename with its own timestamp)
          Write-Output "Waiting for OBS to create log file..."
          $logFile = $null
          $logWaitTimeout = 10
          for ($i = 0; $i -lt $logWaitTimeout; $i++) {
            Start-Sleep -Seconds 1
            $logFiles = Get-ChildItem -Path $obsLogs -Filter "*.txt" -ErrorAction SilentlyContinue | 
                        Where-Object { $_.LastWriteTime -gt (Get-Date).AddSeconds(-15) } |
                        Sort-Object LastWriteTime -Descending
            if ($logFiles) {
              $logFile = $logFiles[0].FullName
              Write-Output "Found OBS log: $logFile"
              break
            }
          }
          
          if (-not $logFile) {
            Write-Error "OBS did not create a log file within ${logWaitTimeout}s!"
            Write-Output "Log directory contents:"
            Get-ChildItem -Path $obsLogs -ErrorAction SilentlyContinue | Format-Table Name, LastWriteTime
            Stop-Process -Id $obsProcess.Id -Force -ErrorAction SilentlyContinue
            exit 1
          }
          
          # Monitor log file for c64stream plugin loading
          Write-Output "Monitoring for c64stream plugin loading..."
          Write-Output "=== OBS Log (Live) ==="
          
          $timeout = 30
          $elapsed = 0
          $pluginLoaded = $false
          $lastLogSize = 0

          while ($elapsed -lt $timeout) {
            Start-Sleep -Seconds 1
            $elapsed++

            if (Test-Path $logFile) {
              # Print new log content as it arrives
              $fileInfo = Get-Item $logFile
              if ($fileInfo.Length -gt $lastLogSize) {
                $newContent = Get-Content $logFile -Raw -ErrorAction SilentlyContinue
                if ($newContent) {
                  $newLines = $newContent.Substring($lastLogSize)
                  Write-Output $newLines
                  $lastLogSize = $fileInfo.Length

                  # Check if c64stream plugin loaded successfully (no errors/warnings)
                  if ($newContent -match "c64stream") {
                    Write-Output "[Monitor] c64stream detected at ${elapsed}s"

                    # Check for errors or warnings related to c64stream
                    if ($newContent -match "error.*c64stream|warning.*c64stream|failed.*c64stream|c64stream.*failed") {
                      Write-Output "[Monitor] Detected errors/warnings with c64stream, continuing..."
                    } else {
                      # Plugin mentioned without errors - likely loaded successfully
                      Write-Output "[Monitor] c64stream appears loaded successfully"
                      $pluginLoaded = $true
                      Start-Sleep -Seconds 2  # Give it a moment to finish
                      break
                    }
                  }
                }
              }
            }

            if ($elapsed % 5 -eq 0) {
              Write-Output "[Monitor] Still monitoring... ${elapsed}s elapsed"
            }
          }

          Write-Output "=== End OBS Log (Live) ==="

          if ($pluginLoaded) {
            Write-Output "✓ Plugin loaded successfully, terminating OBS after ${elapsed}s"
          } else {
            Write-Output "⏱ Timeout reached (${elapsed}s), terminating OBS"
          }

          Stop-Process -Id $obsProcess.Id -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2
          Start-Sleep -Seconds 2

          # Read final log content for assertions
          $logContent = ""
          if (Test-Path $logFile) {
            $logContent = Get-Content $logFile -Raw
          }

          if (-not $logContent) {
            Write-Error "No log content captured!"
            exit 1
          }

          Write-Output ""
          Write-Output "=== Running Assertions ==="

          # ASSERTION 1: Check plugin DLL is loaded
          if ($logContent -match "c64stream\.dll" -or $logContent -match "Loaded module.*c64stream") {
            Write-Output "✅ ASSERTION 1 PASSED: Plugin DLL loaded"
          } else {
            Write-Error "❌ ASSERTION 1 FAILED: Plugin DLL not found in logs"
            exit 1
          }

          # ASSERTION 2: Check plugin registered (source type)
          if ($logContent -match "c64.*stream" -or $logContent -match "C64 Stream") {
            Write-Output "✅ ASSERTION 2 PASSED: Plugin registered"
          } else {
            Write-Error "❌ ASSERTION 2 FAILED: Plugin not registered as source"
            exit 1
          }

          # ASSERTION 3: No critical errors
          $errorPatterns = @(
            "error.*loading.*c64stream",
            "failed.*c64stream",
            "c64stream.*failed",
            "unresolved.*c64stream",
            "missing.*c64stream"
          )

          $foundError = $false
          foreach ($pattern in $errorPatterns) {
            if ($logContent -match $pattern) {
              Write-Error "❌ ASSERTION 3 FAILED: Error detected: $pattern"
              $foundError = $true
            }
          }

          if (-not $foundError) {
            Write-Output "✅ ASSERTION 3 PASSED: No critical errors detected"
          } else {
            exit 1
          }

          Write-Output ""
          Write-Output "🎉 All smoke test assertions PASSED"

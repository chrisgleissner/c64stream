name: Build Project
run-name: ${{ github.ref_name }} build run 🧱

on:
  workflow_call:
    inputs:
      run_e2e:
        description: 'Run E2E tests after build (non-blocking - failures will not fail the build)'
        required: false
        default: true
        type: boolean
      e2e_format:
        description: 'E2E video format (PAL or NTSC)'
        required: false
        default: 'PAL'
        type: string
      e2e_frames:
        description: 'Number of E2E frames to test'
        required: false
        default: '250'
        type: string
      e2e_scenario:
        description: 'E2E scenario to run (e.g., ntsc_amber_monitor, pal_sharp_pixels, or "all" for matrix)'
        required: false
        default: ''
        type: string
    outputs:
      pluginName:
        description: Project name detected by parsing build spec file
        value: ${{ jobs.ubuntu-build.outputs.pluginName }}
      pluginVersion:
        description: Project version detected by parsing build spec file
        value: ${{ jobs.ubuntu-build.outputs.pluginVersion }}

permissions:
  contents: read
  packages: write

jobs:
  check-event:
    name: Check GitHub Event Data 🔎
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    outputs:
      package: ${{ steps.setup.outputs.package }}
      codesign: ${{ steps.setup.outputs.codesign }}
      notarize: ${{ steps.setup.outputs.notarize }}
      config: ${{ steps.setup.outputs.config }}
      commitHash: ${{ steps.setup.outputs.commitHash }}
      pluginName: ${{ steps.setup.outputs.pluginName }}
      pluginVersion: ${{ steps.setup.outputs.pluginVersion }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check Event Data ☑️
        id: setup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          : Check Event Data ☑️
          if [[ "${RUNNER_DEBUG}" ]]; then set -x; fi

          case "${GITHUB_EVENT_NAME}" in
            pull_request)
              config_data=('codesign:false' 'notarize:false' 'package:false' 'config:RelWithDebInfo')
              if gh pr view ${{ github.event.number }} --json labels \
                | jq -e -r '.labels[] | select(.name == "Seeking Testers")' > /dev/null; then
                config_data[0]='codesign:true'
                config_data[2]='package:true'
              fi
              ;;
            push)
              config_data=('codesign:true' 'notarize:false' 'package:true' 'config:RelWithDebInfo')
              if [[ ${GITHUB_REF_NAME} =~ [0-9]+.[0-9]+.[0-9]+(-(rc|beta).+)? ]]; then
                config_data[1]='notarize:true'
                config_data[3]='config:Release'
              fi
              ;;
            workflow_dispatch)
              config_data=('codesign:true' 'notarize:false' 'package:false' 'config:RelWithDebInfo')
              ;;
            schedule)
              config_data=('codesign:true' 'notarize:false' 'package:true' 'config:RelWithDebInfo')
              ;;
            *) ;;
          esac

          for config in "${config_data[@]}"; do
            IFS=':' read -r key value <<< "${config}"
            echo "${key}=${value}" >> $GITHUB_OUTPUT
          done
          echo "commitHash=${GITHUB_SHA:0:9}" >> $GITHUB_OUTPUT

          plugin_name="$(jq -r '.name' buildspec.json)"
          plugin_display_name="$(jq -r '.displayName // empty' buildspec.json)"

          # Version resolution logic - match CMakeLists.txt behavior exactly
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            # For PR builds, calculate the same development version that CMake uses
            base_version="$(jq -r '.version' buildspec.json)"
            IFS='.' read -r major minor patch <<< "${base_version}"
            if [[ -n "${GITHUB_RUN_NUMBER}" ]]; then
              run_mod=$((GITHUB_RUN_NUMBER % 1000))  # Limit to 0-999 range
              dev_patch=$((900 + run_mod))  # Results in 900-1899 range
              plugin_version="${major}.${minor}.${dev_patch}"
            else
              plugin_version="${major}.${minor}.999"
            fi
          else
            # For non-PR builds, use git tag detection (same logic as CMakeLists.txt)
            git_version_tag=$(git describe --tags --always --dirty 2>/dev/null || echo "")
            if [[ "${git_version_tag}" =~ ^v?([0-9]+\.[0-9]+\.[0-9]+) ]]; then
              # Extract version number from tag (e.g., "v1.2.3" -> "1.2.3", "1.2.3-dirty" -> "1.2.3")
              plugin_version=$(echo "${git_version_tag}" | sed -E 's/^v?([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
            else
              # Fallback to buildspec.json version if no proper git tag is available
              plugin_version="$(jq -r '.version' buildspec.json)"
            fi
          fi

          if [[ "${plugin_display_name}" ]]; then
            echo "pluginName=${plugin_display_name}" >> $GITHUB_OUTPUT
          else
            echo "pluginName=${plugin_name}" >> $GITHUB_OUTPUT
          fi
          echo "pluginVersion=${plugin_version}" >> $GITHUB_OUTPUT

  macos-build:
    name: Build for macOS 🍏
    runs-on: macos-15
    needs: check-event
    defaults:
      run:
        shell: zsh --no-rcs --errexit --pipefail {0}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set Up Environment 🔧
        id: setup
        run: |
          : Set Up Environment 🔧
          if (( ${+RUNNER_DEBUG} )) setopt XTRACE

          print '::group::Enable Xcode 16.1'
          sudo xcode-select --switch /Applications/Xcode_16.1.0.app/Contents/Developer
          print '::endgroup::'

          print '::group::Clean Homebrew Environment'
          local -a unwanted_formulas=()
          local -a remove_formulas=()
          for formula (${unwanted_formulas}) {
            if [[ -d ${HOMEBREW_PREFIX}/Cellar/${formula} ]] remove_formulas+=(${formula})
          }

          if (( #remove_formulas )) brew uninstall --ignore-dependencies ${remove_formulas}
          print '::endgroup::'

          local product_name
          read -r product_name <<< \
            "$(jq -r '.name' buildspec.json)"

          print "pluginName=${product_name}" >> $GITHUB_OUTPUT
          print "pluginVersion=${{ needs.check-event.outputs.pluginVersion }}" >> $GITHUB_OUTPUT

      - uses: actions/cache/restore@v4
        id: ccache-cache
        with:
          path: ${{ github.workspace }}/.ccache
          key: ${{ runner.os }}-ccache-${{ needs.check-event.outputs.config }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Set Up Codesigning 🔑
        uses: ./.github/actions/setup-macos-codesigning
        if: fromJSON(needs.check-event.outputs.codesign)
        id: codesign
        with:
          codesignIdentity: ${{ secrets.MACOS_SIGNING_APPLICATION_IDENTITY }}
          installerIdentity: ${{ secrets.MACOS_SIGNING_INSTALLER_IDENTITY }}
          codesignCertificate: ${{ secrets.MACOS_SIGNING_CERT }}
          certificatePassword: ${{ secrets.MACOS_SIGNING_CERT_PASSWORD }}
          keychainPassword: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
          provisioningProfile: ${{ secrets.MACOS_SIGNING_PROVISIONING_PROFILE }}
          notarizationUser: ${{ secrets.MACOS_NOTARIZATION_USERNAME }}
          notarizationPassword: ${{ secrets.MACOS_NOTARIZATION_PASSWORD }}

      - name: Build Plugin 🧱
        uses: ./.github/actions/build-plugin
        with:
          target: macos-universal
          config: ${{ needs.check-event.outputs.config }}
          codesign: ${{ fromJSON(needs.check-event.outputs.codesign) }}
          codesignIdent: ${{ steps.codesign.outputs.codesignIdent }}

      - name: Package Plugin 📀
        uses: ./.github/actions/package-plugin
        with:
          target: macos-universal
          config: ${{ needs.check-event.outputs.config }}
          package: ${{ fromJSON(needs.check-event.outputs.package) }}
          codesign: ${{ fromJSON(needs.check-event.outputs.codesign) && fromJSON(steps.codesign.outputs.haveCodesignIdent) }}
          codesignIdent: ${{ steps.codesign.outputs.codesignIdent }}
          installerIdent: ${{ steps.codesign.outputs.installerIdent }}
          codesignTeam: ${{ steps.codesign.outputs.codesignTeam }}
          notarize: ${{ fromJSON(needs.check-event.outputs.notarize) && fromJSON(steps.codesign.outputs.haveNotarizationUser) }}
          codesignUser: ${{ secrets.MACOS_NOTARIZATION_USERNAME }}
          codesignPass: ${{ secrets.MACOS_NOTARIZATION_PASSWORD }}
          version: ${{ needs.check-event.outputs.pluginVersion }}

      - name: Upload Artifacts 📡
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.setup.outputs.pluginName }}-${{ steps.setup.outputs.pluginVersion }}-macos-universal-${{ needs.check-event.outputs.commitHash }}
          path: ${{ github.workspace }}/release/${{ steps.setup.outputs.pluginName }}-${{ steps.setup.outputs.pluginVersion }}-macos-universal.*

      - name: Upload Debug Symbol Artifacts 🪲
        uses: actions/upload-artifact@v4
        if: ${{ needs.check-event.outputs.config == 'Release' }}
        with:
          name: ${{ steps.setup.outputs.pluginName }}-${{ steps.setup.outputs.pluginVersion }}-macos-universal-${{ needs.check-event.outputs.commitHash }}-dSYMs
          path: ${{ github.workspace }}/release/${{ steps.setup.outputs.pluginName }}-${{ steps.setup.outputs.pluginVersion }}-macos-universal-dSYMs.*

  # Step 1: Ensure Docker Images (all Linux distributions)
  ensure-docker-images:
    name: Ensure Docker Image 🐳 (${{ matrix.display_name }})
    runs-on: ubuntu-24.04
    needs: [check-event]
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: ubuntu
            dockerfile: Dockerfile.ubuntu-build
            image_name: ubuntu-build
            display_name: Ubuntu 24.04
          - distro: debian
            dockerfile: Dockerfile.debian-build
            image_name: debian-build
            display_name: Debian 12
          - distro: fedora
            dockerfile: Dockerfile.fedora-build
            image_name: fedora-build
            display_name: Fedora 40
          - distro: arch
            dockerfile: Dockerfile.arch-build
            image_name: arch-build
            display_name: Arch Linux
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout Repository 📥
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Image Age 🔍
        id: check
        run: |
          : Check Image Age for ${{ matrix.display_name }} 🔍

          dockerfile_path=".github/docker/${{ matrix.dockerfile }}"
          image_tag="ghcr.io/${{ github.repository }}/${{ matrix.image_name }}:latest"

          if docker manifest inspect "${image_tag}" >/dev/null 2>&1; then
            docker pull "${image_tag}" >/dev/null 2>&1 || true

            created_timestamp=$(docker inspect "${image_tag}" --format='{{.Created}}' 2>/dev/null || echo "")
            if [[ -n "${created_timestamp}" ]]; then
              echo "🔍 Checking for Dockerfile changes since image creation: ${created_timestamp}"
              dockerfile_commits=$(git log --since="${created_timestamp}" --oneline --pretty=format:"%H %ci %s" -- "${dockerfile_path}" 2>/dev/null || true)
              if [[ -n "${dockerfile_commits}" ]]; then
                commits_since_image=$(echo "${dockerfile_commits}" | wc -l | tr -d '[:space:]')
              else
                commits_since_image=0
              fi

              if [[ "${commits_since_image}" -gt 0 ]]; then
                echo "🔧 Found ${commits_since_image} Dockerfile commits since image creation:"
                echo "${dockerfile_commits}"
                echo "needs_build=true" >> $GITHUB_OUTPUT
                echo "🔧 Dockerfile modified since image creation - rebuilding"
                exit 0
              fi

              image_created_epoch=$(date -d "${created_timestamp}" +%s 2>/dev/null || echo "0")
              current_epoch=$(date +%s)
              age_seconds=$(( current_epoch - image_created_epoch ))
              age_hours=$(( age_seconds / 3600 ))
              age_days=$(( age_seconds / 86400 ))

              # 7 days = 604800 seconds
              max_age_seconds=604800
              echo "📅 Image created: ${created_timestamp}"
              echo "📅 Image age: ${age_days}d ${age_hours}h (${age_seconds}s), Dockerfile unchanged"

              if [[ "${age_seconds}" -le "${max_age_seconds}" ]]; then
                echo "needs_build=false" >> $GITHUB_OUTPUT
                echo "✅ Using existing image (${age_days}d ${age_hours}h old, Dockerfile unchanged)"
                exit 0
              else
                echo "needs_build=true" >> $GITHUB_OUTPUT
                echo "🔄 Image is ${age_days}d ${age_hours}h old - rebuilding for freshness"
                exit 0
              fi
            fi
          fi

          echo "needs_build=true" >> $GITHUB_OUTPUT
          echo "🔨 Image not found - will build new image"

      - name: Set up Docker Buildx 🔧
        if: steps.check.outputs.needs_build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry 🔑
        if: steps.check.outputs.needs_build == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image 🚀
        if: steps.check.outputs.needs_build == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: .github/docker/${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}/${{ matrix.image_name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Step 2: Ubuntu Build (uses Docker image)
  ubuntu-build:
    name: Ubuntu Build 🐧
    runs-on: ubuntu-24.04
    needs: [check-event, ensure-docker-images]
    defaults:
      run:
        shell: bash
    container:
      image: ghcr.io/${{ github.repository }}/ubuntu-build:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      pluginName: ${{ steps.setup.outputs.pluginName }}
      pluginVersion: ${{ steps.setup.outputs.pluginVersion }}
      artifactName: ${{ steps.setup.outputs.artifactName }}
    steps:
      - name: Checkout Repository �
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Fetch Git Tags 🏷️
        run: |
          : Fetch Git Tags 🏷️
          git config --global --add safe.directory "$(pwd)"
          git fetch --force --tags

      - name: Set Up Environment 🔧
        id: setup
        run: |
          : Set Up Environment 🔧
          if [[ "${RUNNER_DEBUG}" ]]; then set -x; fi

          # Extract project info
          read -r product_name <<< \
            "$(jq -r '.name' buildspec.json)"

          artifact_name="${product_name}-${{ needs.check-event.outputs.pluginVersion }}-ubuntu-24.04-x86_64-${{ needs.check-event.outputs.commitHash }}"

          echo "pluginName=${product_name}" >> $GITHUB_OUTPUT
          echo "pluginVersion=${{ needs.check-event.outputs.pluginVersion }}" >> $GITHUB_OUTPUT
          echo "artifactName=${artifact_name}" >> $GITHUB_OUTPUT

          echo "🔧 Building ${product_name} v${{ needs.check-event.outputs.pluginVersion }}"

      - name: Configure ccache 🗂️
        run: |
          : Configure ccache �️
          ccache --set-config cache_dir=/workspace/.ccache
          ccache --set-config max_size=2G
          ccache --show-config
          ccache --zero-stats

      - name: Build Plugin 🧱
        run: |
          : Build Plugin 🧱
          export PATH="/usr/local/bin:$PATH"

          # Configure CMake
          cmake --preset ubuntu-x86_64 -DCMAKE_INSTALL_PREFIX=/usr

          # Build with Ninja
          cmake --build build_x86_64 --config ${{ needs.check-event.outputs.config }} --parallel

      - name: Package Plugin 📦
        env:
          PLUGIN_VERSION_OVERRIDE: ${{ needs.check-event.outputs.pluginVersion }}
        run: |
          : Package Plugin 📦
          cmake --build build_x86_64 --config ${{ needs.check-event.outputs.config }} -t package_source
          cmake --build build_x86_64 --config ${{ needs.check-event.outputs.config }} -t package

      - name: Prepare Artifacts 📋
        run: |
          : Prepare Artifacts 📋
          mkdir -p release

          # Move artifacts to release directory
          if [[ -f build_x86_64/*.tar.xz ]]; then
            mv build_x86_64/*.tar.xz release/
          fi
          if [[ -f build_x86_64/*.deb ]]; then
            mv build_x86_64/*.deb release/
          fi
          if [[ -f build_x86_64/*.ddeb ]]; then
            mv build_x86_64/*.ddeb release/
          fi

          # List what we built
          echo "📦 Built artifacts:"
          ls -la release/ || echo "No release artifacts found"
          ls -la build_x86_64/ | grep -E '\.(so|tar\.xz|deb|ddeb)$' || echo "No build artifacts found"

      - name: Upload Plugin Binary 📤
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.setup.outputs.artifactName }}
          path: |
            build_x86_64/c64stream.so
            release/*x86_64*.tar.xz
            release/*x86_64*.deb
          if-no-files-found: error

      - name: Upload Source Tarball 🗜️
        uses: actions/upload-artifact@v4
        if: ${{ fromJSON(needs.check-event.outputs.package) }}
        with:
          name: ${{ steps.setup.outputs.pluginName }}-${{ steps.setup.outputs.pluginVersion }}-ubuntu-24.04-sources-${{ needs.check-event.outputs.commitHash }}
          path: release/*source.*

      - name: Upload Debug Symbols 🪲
        uses: actions/upload-artifact@v4
        if: ${{ fromJSON(needs.check-event.outputs.package) }}
        with:
          name: ${{ steps.setup.outputs.artifactName }}-dbgsym
          path: release/*dbgsym.ddeb

  windows-build:
    name: Build for Windows 🪟
    runs-on: windows-2022
    needs: check-event
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set Up Environment 🔧
        id: setup
        run: |
          : Set Up Environment 🔧
          if [[ "${RUNNER_DEBUG}" ]]; then set -x; fi

          read -r product_name <<< \
            "$(jq -r '.name' buildspec.json)"

          echo "pluginName=${product_name}" >> $GITHUB_OUTPUT
          echo "pluginVersion=${{ needs.check-event.outputs.pluginVersion }}" >> $GITHUB_OUTPUT

      - uses: actions/cache/restore@v4
        id: ccache-cache
        with:
          path: ${{ github.workspace }}/.ccache
          key: ${{ runner.os }}-ccache-${{ needs.check-event.outputs.config }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Build Plugin 🧱
        uses: ./.github/actions/build-plugin
        with:
          target: x64
          config: ${{ needs.check-event.outputs.config }}

      - name: Package Plugin 📀
        uses: ./.github/actions/package-plugin
        with:
          target: x64
          config: ${{ needs.check-event.outputs.config }}
          package: ${{ fromJSON(needs.check-event.outputs.package) }}
          version: ${{ needs.check-event.outputs.pluginVersion }}

      - name: Upload Artifacts 📡
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.setup.outputs.pluginName }}-${{ steps.setup.outputs.pluginVersion }}-windows-x64-${{ needs.check-event.outputs.commitHash }}
          path: ${{ github.workspace }}/release/${{ steps.setup.outputs.pluginName }}-${{ steps.setup.outputs.pluginVersion }}-windows-x64*.*



  # E2E Basic Test (Multi-Distro) - runs basic E2E scenario on all Linux distributions
  e2e-basic:
    name: E2E Basic (${{ matrix.display_name }}) 🧪
    if: ${{ inputs.run_e2e }}
    runs-on: ubuntu-24.04
    needs: [check-event, ubuntu-build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: ubuntu
            image_tag: ghcr.io/${{ github.repository }}/ubuntu-build:latest
            display_name: Ubuntu 24.04
          - distro: debian
            image_tag: ghcr.io/${{ github.repository }}/debian-build:latest
            display_name: Debian 12
          - distro: fedora
            image_tag: ghcr.io/${{ github.repository }}/fedora-build:latest
            display_name: Fedora 40
          - distro: arch
            image_tag: ghcr.io/${{ github.repository }}/arch-build:latest
            display_name: Arch Linux
    defaults:
      run:
        shell: bash
    container:
      image: ${{ matrix.image_tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: >-
        --user root
        --privileged
    env:
      DISPLAY: ":99"
    steps:
      - name: Checkout Repository 📥
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Download Plugin Artifact 📥
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.ubuntu-build.outputs.artifactName }}
          path: artifact

      - name: Install Plugin 📦
        run: |
          : Install Plugin 📦

          # Show what was downloaded
          echo "📁 Downloaded artifact contents:"
          find artifact -type f -ls

          # Install from downloaded Ubuntu artifact (preserves directory structure)
          mkdir -p "$HOME/.config/obs-studio/plugins/c64stream/bin/64bit"
          cp "artifact/build_x86_64/c64stream.so" "$HOME/.config/obs-studio/plugins/c64stream/bin/64bit/c64stream.so"

          mkdir -p "$HOME/.config/obs-studio/plugins/c64stream/data"
          cp -r data/* "$HOME/.config/obs-studio/plugins/c64stream/data/"

          ls -la "$HOME/.config/obs-studio/plugins/c64stream/bin/64bit/c64stream.so"

      - name: Apply E2E Properties to System Plugin Data 🔧
        run: |
          : Apply E2E Properties to System Plugin Data 🔧
          # Ensure the system-wide plugin uses E2E test properties inside the container

          SYS_DATA_DIR="/usr/share/obs/obs-plugins/c64stream"
          echo "📁 Ensuring system plugin data dir: ${SYS_DATA_DIR}"
          mkdir -p "${SYS_DATA_DIR}"

          if [[ -f "tests/e2e/properties_e2e_ci.ini" ]]; then
            cp "tests/e2e/properties_e2e_ci.ini" "${SYS_DATA_DIR}/properties.ini"
            echo "✅ Copied E2E CI properties file for testing"
            ls -la "${SYS_DATA_DIR}/properties.ini"
            echo "Properties content:"
            cat "${SYS_DATA_DIR}/properties.ini"
          else
            echo "❌ E2E CI properties file not found: tests/e2e/properties_e2e_ci.ini"
          fi

      - name: Setup PulseAudio 🔊
        run: |
          : Setup PulseAudio 🔊
          # Ensure an audio server is available for OBS (PulseAudio or PipeWire Pulse)
          # Notes:
          # - Many CI container jobs run as root; PulseAudio user mode refuses root.
          # - Fedora uses PipeWire with PulseAudio compatibility.

          export XDG_RUNTIME_DIR="/tmp/runtime-root"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"

          mkdir -p "$XDG_RUNTIME_DIR/pulse"
          chmod 700 "$XDG_RUNTIME_DIR/pulse"

          echo "🔊 Ensuring audio server is running..."

          if command -v pactl >/dev/null 2>&1 && pactl info >/dev/null 2>&1; then
            echo "✅ Audio server already available"
          else
            if command -v pulseaudio >/dev/null 2>&1; then
              if [[ "$(id -u)" -eq 0 ]]; then
                mkdir -p /etc/pulse
                printf '%s\n' \
                  "load-module module-native-protocol-unix socket=${XDG_RUNTIME_DIR}/pulse/native auth-anonymous=1" \
                  'load-module module-null-sink sink_name=dummy sink_properties=device.description="Dummy_Output"' \
                  'set-default-sink dummy' \
                  > /etc/pulse/system.pa

                echo "🔊 Starting PulseAudio in system mode (root)..."
                pulseaudio --system --disallow-exit --disallow-module-loading=0 \
                  --log-target=file:/tmp/pulseaudio.log 2>&1 &
                PULSE_PID=$!
              else
                echo "🔊 Starting PulseAudio in user mode..."
                pulseaudio --start --exit-idle-time=-1 \
                  --load="module-null-sink sink_name=dummy" \
                  --log-target=file:/tmp/pulseaudio.log 2>&1 || true
                PULSE_PID=""
              fi

              for i in {1..10}; do
                if pulseaudio --check 2>/dev/null; then
                  if [[ -S "${XDG_RUNTIME_DIR}/pulse/native" ]]; then
                    export PULSE_SERVER="unix:${XDG_RUNTIME_DIR}/pulse/native"
                  fi
                  if command -v pactl >/dev/null 2>&1 && pactl info >/dev/null 2>&1; then
                    echo "✅ PulseAudio running${PULSE_PID:+ (PID: $PULSE_PID)}"
                    break
                  fi
                fi
                if [[ $i -eq 10 ]]; then
                  echo "⚠️ PulseAudio may not have started correctly (continuing anyway)"
                  cat /tmp/pulseaudio.log 2>/dev/null || true
                fi
                sleep 0.5
              done
            elif command -v pipewire-pulse >/dev/null 2>&1; then
              echo "🔊 Starting pipewire-pulse..."
              pipewire-pulse --log-level=2 > /tmp/pipewire-pulse.log 2>&1 &
              PIPEWIRE_PULSE_PID=$!

              for i in {1..10}; do
                if command -v pactl >/dev/null 2>&1 && pactl info >/dev/null 2>&1; then
                  if [[ -S "${XDG_RUNTIME_DIR}/pulse/native" ]]; then
                    export PULSE_SERVER="unix:${XDG_RUNTIME_DIR}/pulse/native"
                  fi
                  echo "✅ pipewire-pulse running (PID: $PIPEWIRE_PULSE_PID)"
                  break
                fi
                if [[ $i -eq 10 ]]; then
                  echo "⚠️ pipewire-pulse may not have started correctly (continuing anyway)"
                  cat /tmp/pipewire-pulse.log 2>/dev/null || true
                fi
                sleep 0.5
              done
            else
              echo "⚠️ No PulseAudio/PipeWire Pulse daemon found in image"
            fi
          fi

          pactl info 2>/dev/null || echo "pactl info unavailable"

      - name: Setup X11 Display 🖥️
        run: |
          : Setup X11 Display 🖥️

          # Set up environment for headless operation
          export DISPLAY=:99
          export QT_QPA_PLATFORM=xcb
          export QT_X11_NO_MITSHM=1
          export LIBGL_ALWAYS_SOFTWARE=1
          export XDG_RUNTIME_DIR="/tmp/runtime-root"

          if [[ -S "${XDG_RUNTIME_DIR}/pulse/native" ]]; then
            export PULSE_SERVER="unix:${XDG_RUNTIME_DIR}/pulse/native"
          else
            unset PULSE_SERVER
          fi

          # Clean up any stale processes and lock files
          echo "🧹 Cleaning up previous X11 sessions..."
          pkill -f "Xvfb.*:99" 2>/dev/null || true
          rm -f /tmp/.X99-lock /tmp/.X*-lock 2>/dev/null || true
          sleep 2

          # Ensure X11 directories exist with proper permissions
          mkdir -p /tmp/.X11-unix
          chmod 1777 /tmp/.X11-unix 2>/dev/null || true

          # Create Xauthority file
          export XAUTHORITY="/tmp/.Xauth$$"
          touch "$XAUTHORITY"
          chmod 600 "$XAUTHORITY"

          echo "🚀 Starting Xvfb with comprehensive configuration..."

          # Start Xvfb with advanced parameters from E2E branch
          XVFB_LOG_FILE="/tmp/xvfb.log"
          Xvfb :99 \
            -screen 0 1280x720x24 \
            -ac \
            +extension GLX \
            +extension RANDR \
            +render \
            -noreset \
            -nolisten tcp \
            -dpi 96 \
            > "$XVFB_LOG_FILE" 2>&1 &
          XVFB_PID=$!

          # Setup comprehensive cleanup on exit
          cleanup_xvfb() {
            if [[ -n "$XVFB_PID" ]] && kill -0 "$XVFB_PID" 2>/dev/null; then
              echo "🧹 Cleaning up Xvfb process..."
              kill "$XVFB_PID" 2>/dev/null || true
              sleep 2
              # Force kill if still running
              kill -9 "$XVFB_PID" 2>/dev/null || true
              wait "$XVFB_PID" 2>/dev/null || true
            fi
            rm -f /tmp/.X99-lock "$XAUTHORITY" 2>/dev/null || true
          }
          trap cleanup_xvfb EXIT INT TERM

          # Wait for Xvfb to initialize with progressive checks
          echo "⏳ Waiting for Xvfb to initialize..."
          for i in {1..15}; do
            # Basic liveness checks that work even when xdpyinfo isn't installed
            if kill -0 "$XVFB_PID" 2>/dev/null && [[ -S /tmp/.X11-unix/X99 ]]; then
              if command -v xdpyinfo >/dev/null 2>&1; then
                if xdpyinfo -display :99 >/dev/null 2>&1; then
                  echo "✅ Xvfb initialized successfully (attempt $i)"
                  break
                fi
              else
                echo "✅ Xvfb appears up (socket present); xdpyinfo not available"
                break
              fi
            fi

            if [[ $i -eq 15 ]]; then
              echo "❌ Xvfb failed to start after 15 attempts"
              echo "📋 Diagnostics:"
              echo "- Xvfb binary: $(command -v Xvfb || echo missing)"
              echo "- Socket dir:" && ls -la /tmp/.X11-unix 2>/dev/null || true
              echo "- Xvfb PID: ${XVFB_PID}" && ps -p "$XVFB_PID" -o pid,comm,args 2>/dev/null || true
              echo "📋 Xvfb log:"
              cat "$XVFB_LOG_FILE" 2>/dev/null || echo "No log available"
              exit 1
            fi

            echo "   Attempt $i/15 - waiting..."
            sleep 1
          done

          echo "✅ X11 display ready with advanced configuration"

      - name: Run Basic E2E Test 🧪
        id: run_e2e
        run: |
          : "Run Basic E2E Test 🧪"

          cd tests/e2e

          # Run the default/basic scenario only
          ./e2e.sh \
            --format "${{ inputs.e2e_format }}" \
            --frames "${{ inputs.e2e_frames }}" \
            --output-dir "../../e2e-results" \
            --skip-build \
            --verbose \
            --display ":99"

      - name: Collect Test Artifacts 📋
        if: always()
        run: |
          : Collect Test Artifacts 📋

          mkdir -p e2e-artifacts

          # Collect test results
          if [[ -d e2e-results ]]; then
            cp -r e2e-results/* e2e-artifacts/
          fi

          # Collect MP4/AVI/WAV/CSV from test_output if present
          if [[ -d tests/e2e/test_output ]]; then
            mkdir -p e2e-artifacts/output
            cp -r tests/e2e/test_output/* e2e-artifacts/output/ 2>/dev/null || true
          fi

          # Collect plugin recording session folder if present
          if [[ -d "$HOME/Documents/obs-studio/c64stream/recordings" ]]; then
            mkdir -p e2e-artifacts/recordings
            cp -r "$HOME/Documents/obs-studio/c64stream/recordings"/* e2e-artifacts/recordings/ 2>/dev/null || true
          fi

          # Collect OBS logs
          if [[ -d ~/.config/obs-studio/logs ]]; then
            mkdir -p e2e-artifacts/obs-logs
            cp ~/.config/obs-studio/logs/* e2e-artifacts/obs-logs/ 2>/dev/null || true
          fi

          # Create summary
          echo "E2E Basic Test Summary" > e2e-artifacts/summary.txt
          echo "Distro: ${{ matrix.display_name }}" >> e2e-artifacts/summary.txt
          echo "Format: ${{ inputs.e2e_format }}" >> e2e-artifacts/summary.txt
          echo "Frames: ${{ inputs.e2e_frames }}" >> e2e-artifacts/summary.txt
          echo "Date: $(date)" >> e2e-artifacts/summary.txt

      - name: Upload E2E Artifacts 📤
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-basic-results-${{ matrix.distro }}-${{ needs.check-event.outputs.commitHash }}
          path: e2e-artifacts/
          if-no-files-found: warn

      - name: E2E Test Status Summary 📊
        if: always()
        run: |
          : E2E Test Status Summary 📊

          # Check if the E2E test step passed or failed
          if [[ "${{ steps.run_e2e.outcome }}" == "success" ]]; then
            echo "✅ **E2E Basic Test PASSED on ${{ matrix.display_name }}**" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **E2E Basic Test FAILED on ${{ matrix.display_name }}**" >> $GITHUB_STEP_SUMMARY
            echo "📦 Check E2E artifacts for debugging info." >> $GITHUB_STEP_SUMMARY
          fi


  # E2E Full Test (Ubuntu, Matrix) - runs all scenarios in parallel
  # Runs concurrently with e2e-basic for faster CI
  e2e-full:
    name: E2E Full (${{ matrix.scenario }}) 🧪
    if: ${{ inputs.run_e2e }}
    runs-on: ubuntu-24.04
    needs: [check-event, ubuntu-build]
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        scenario:
          - ntsc_amber_monitor
          - ntsc_arcade_cabinet
          - ntsc_classic_crt
          - ntsc_default
          - ntsc_delay_500ms
          - ntsc_green_monitor
          - ntsc_phosphor_glow
          - ntsc_sharp_pixels
          - ntsc_sharp_scan_lines
          - ntsc_vintage_tv
          - pal_default
    defaults:
      run:
        shell: bash
    container:
      image: ghcr.io/${{ github.repository }}/ubuntu-build:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: >-
        --user root
        --privileged
    env:
      DISPLAY: ":99"
    steps:
      - name: Checkout Repository 📥
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Download Plugin Artifact 📥
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.ubuntu-build.outputs.artifactName }}
          path: artifact

      - name: Install Plugin 📦
        run: |
          : Install Plugin 📦

          # Show what was downloaded
          echo "📁 Downloaded artifact contents:"
          find artifact -type f -ls

          # Install from downloaded Ubuntu artifact (preserves directory structure)
          mkdir -p "$HOME/.config/obs-studio/plugins/c64stream/bin/64bit"
          cp "artifact/build_x86_64/c64stream.so" "$HOME/.config/obs-studio/plugins/c64stream/bin/64bit/c64stream.so"

          mkdir -p "$HOME/.config/obs-studio/plugins/c64stream/data"
          cp -r data/* "$HOME/.config/obs-studio/plugins/c64stream/data/"

          ls -la "$HOME/.config/obs-studio/plugins/c64stream/bin/64bit/c64stream.so"

      - name: Apply E2E Properties to System Plugin Data 🔧
        run: |
          : Apply E2E Properties to System Plugin Data 🔧
          # Ensure the system-wide plugin uses E2E test properties inside the container

          SYS_DATA_DIR="/usr/share/obs/obs-plugins/c64stream"
          echo "📁 Ensuring system plugin data dir: ${SYS_DATA_DIR}"
          mkdir -p "${SYS_DATA_DIR}"

          if [[ -f "tests/e2e/properties_e2e_ci.ini" ]]; then
            cp "tests/e2e/properties_e2e_ci.ini" "${SYS_DATA_DIR}/properties.ini"
            echo "✅ Copied E2E CI properties file for testing"
            ls -la "${SYS_DATA_DIR}/properties.ini"
            echo "Properties content:"
            cat "${SYS_DATA_DIR}/properties.ini"
          else
            echo "❌ E2E CI properties file not found: tests/e2e/properties_e2e_ci.ini"
          fi

      - name: Setup PulseAudio 🔊
        run: |
          : Setup PulseAudio 🔊
          # Ensure an audio server is available for OBS (PulseAudio or PipeWire Pulse)
          # Notes:
          # - Many CI container jobs run as root; PulseAudio user mode refuses root.
          # - Fedora uses PipeWire with PulseAudio compatibility.

          export XDG_RUNTIME_DIR="/tmp/runtime-root"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"

          mkdir -p "$XDG_RUNTIME_DIR/pulse"
          chmod 700 "$XDG_RUNTIME_DIR/pulse"

          echo "🔊 Ensuring audio server is running..."

          if command -v pactl >/dev/null 2>&1 && pactl info >/dev/null 2>&1; then
            echo "✅ Audio server already available"
          else
            if command -v pulseaudio >/dev/null 2>&1; then
              if [[ "$(id -u)" -eq 0 ]]; then
                mkdir -p /etc/pulse
                printf '%s\n' \
                  "load-module module-native-protocol-unix socket=${XDG_RUNTIME_DIR}/pulse/native auth-anonymous=1" \
                  'load-module module-null-sink sink_name=dummy sink_properties=device.description="Dummy_Output"' \
                  'set-default-sink dummy' \
                  > /etc/pulse/system.pa

                echo "🔊 Starting PulseAudio in system mode (root)..."
                pulseaudio --system --disallow-exit --disallow-module-loading=0 \
                  --log-target=file:/tmp/pulseaudio.log 2>&1 &
                PULSE_PID=$!
              else
                echo "🔊 Starting PulseAudio in user mode..."
                pulseaudio --start --exit-idle-time=-1 \
                  --load="module-null-sink sink_name=dummy" \
                  --log-target=file:/tmp/pulseaudio.log 2>&1 || true
                PULSE_PID=""
              fi

              for i in {1..10}; do
                if pulseaudio --check 2>/dev/null; then
                  if [[ -S "${XDG_RUNTIME_DIR}/pulse/native" ]]; then
                    export PULSE_SERVER="unix:${XDG_RUNTIME_DIR}/pulse/native"
                  fi
                  if command -v pactl >/dev/null 2>&1 && pactl info >/dev/null 2>&1; then
                    echo "✅ PulseAudio running${PULSE_PID:+ (PID: $PULSE_PID)}"
                    break
                  fi
                fi
                if [[ $i -eq 10 ]]; then
                  echo "⚠️ PulseAudio may not have started correctly (continuing anyway)"
                  cat /tmp/pulseaudio.log 2>/dev/null || true
                fi
                sleep 0.5
              done
            elif command -v pipewire-pulse >/dev/null 2>&1; then
              echo "🔊 Starting pipewire-pulse..."
              pipewire-pulse --log-level=2 > /tmp/pipewire-pulse.log 2>&1 &
              PIPEWIRE_PULSE_PID=$!

              for i in {1..10}; do
                if command -v pactl >/dev/null 2>&1 && pactl info >/dev/null 2>&1; then
                  if [[ -S "${XDG_RUNTIME_DIR}/pulse/native" ]]; then
                    export PULSE_SERVER="unix:${XDG_RUNTIME_DIR}/pulse/native"
                  fi
                  echo "✅ pipewire-pulse running (PID: $PIPEWIRE_PULSE_PID)"
                  break
                fi
                if [[ $i -eq 10 ]]; then
                  echo "⚠️ pipewire-pulse may not have started correctly (continuing anyway)"
                  cat /tmp/pipewire-pulse.log 2>/dev/null || true
                fi
                sleep 0.5
              done
            else
              echo "⚠️ No PulseAudio/PipeWire Pulse daemon found in image"
            fi
          fi

          pactl info 2>/dev/null || echo "pactl info unavailable"

      - name: Setup X11 Display 🖥️
        run: |
          : Setup X11 Display 🖥️

          # Set up environment for headless operation
          export DISPLAY=:99
          export QT_QPA_PLATFORM=xcb
          export QT_X11_NO_MITSHM=1
          export LIBGL_ALWAYS_SOFTWARE=1
          export XDG_RUNTIME_DIR="/tmp/runtime-root"

          if [[ -S "${XDG_RUNTIME_DIR}/pulse/native" ]]; then
            export PULSE_SERVER="unix:${XDG_RUNTIME_DIR}/pulse/native"
          else
            unset PULSE_SERVER
          fi

          # Clean up any stale processes and lock files
          echo "🧹 Cleaning up previous X11 sessions..."
          pkill -f "Xvfb.*:99" 2>/dev/null || true
          rm -f /tmp/.X99-lock /tmp/.X*-lock 2>/dev/null || true
          sleep 2

          # Ensure X11 directories exist with proper permissions
          mkdir -p /tmp/.X11-unix
          chmod 1777 /tmp/.X11-unix 2>/dev/null || true

          # Create Xauthority file
          export XAUTHORITY="/tmp/.Xauth$$"
          touch "$XAUTHORITY"
          chmod 600 "$XAUTHORITY"

          echo "🚀 Starting Xvfb with comprehensive configuration..."

          # Start Xvfb with advanced parameters from E2E branch
          XVFB_LOG_FILE="/tmp/xvfb.log"
          Xvfb :99 \
            -screen 0 1280x720x24 \
            -ac \
            +extension GLX \
            +extension RANDR \
            +render \
            -noreset \
            -nolisten tcp \
            -dpi 96 \
            > "$XVFB_LOG_FILE" 2>&1 &
          XVFB_PID=$!

          # Setup comprehensive cleanup on exit
          cleanup_xvfb() {
            if [[ -n "$XVFB_PID" ]] && kill -0 "$XVFB_PID" 2>/dev/null; then
              echo "🧹 Cleaning up Xvfb process..."
              kill "$XVFB_PID" 2>/dev/null || true
              sleep 2
              # Force kill if still running
              kill -9 "$XVFB_PID" 2>/dev/null || true
              wait "$XVFB_PID" 2>/dev/null || true
            fi
            rm -f /tmp/.X99-lock "$XAUTHORITY" 2>/dev/null || true
          }
          trap cleanup_xvfb EXIT INT TERM

          # Wait for Xvfb to initialize with progressive checks
          echo "⏳ Waiting for Xvfb to initialize..."
          for i in {1..15}; do
            # Basic liveness checks that work even when xdpyinfo isn't installed
            if kill -0 "$XVFB_PID" 2>/dev/null && [[ -S /tmp/.X11-unix/X99 ]]; then
              if command -v xdpyinfo >/dev/null 2>&1; then
                if xdpyinfo -display :99 >/dev/null 2>&1; then
                  echo "✅ Xvfb initialized successfully (attempt $i)"
                  break
                fi
              else
                echo "✅ Xvfb appears up (socket present); xdpyinfo not available"
                break
              fi
            fi

            if [[ $i -eq 15 ]]; then
              echo "❌ Xvfb failed to start after 15 attempts"
              echo "📋 Diagnostics:"
              echo "- Xvfb binary: $(command -v Xvfb || echo missing)"
              echo "- Socket dir:" && ls -la /tmp/.X11-unix 2>/dev/null || true
              echo "- Xvfb PID: ${XVFB_PID}" && ps -p "$XVFB_PID" -o pid,comm,args 2>/dev/null || true
              echo "📋 Xvfb log:"
              cat "$XVFB_LOG_FILE" 2>/dev/null || echo "No log available"
              exit 1
            fi

            echo "   Attempt $i/15 - waiting..."
            sleep 1
          done

          echo "✅ X11 display ready with advanced configuration"

      - name: Run E2E Scenario 🧪
        id: run_e2e
        run: |
          : "Run E2E Scenario: ${{ matrix.scenario }} 🧪"

          cd tests/e2e

          # Start resource monitoring in background (CPU, RAM, disk every 1 second)
          echo "📊 Starting resource monitoring..."
          MONITOR_LOG="../../e2e-results/resource_monitor.log"
          mkdir -p ../../e2e-results
          (
            echo "timestamp,cpu_user,cpu_sys,cpu_idle,mem_total_mb,mem_used_mb,mem_avail_mb,disk_used_pct" > "$MONITOR_LOG"
            while true; do
              TIMESTAMP=$(date +%Y-%m-%dT%H:%M:%S)
              CPU=$(top -bn1 | grep "Cpu(s)" | awk '{print $2","$4","$8}' | tr -d '%us,sy,id')
              MEM=$(free -m | awk '/Mem:/ {print $2","$3","$7}')
              DISK=$(df -h / | awk 'NR==2 {print $5}' | tr -d '%')
              echo "${TIMESTAMP},${CPU},${MEM},${DISK}" >> "$MONITOR_LOG"
              sleep 1
            done
          ) &
          MONITOR_PID=$!

          # Ensure monitor is killed on exit
          trap "kill $MONITOR_PID 2>/dev/null || true" EXIT

          # Run the specific scenario from the matrix
          # NOTE: Do NOT pass --format here - scenarios define their own format in scenario.yaml
          ./e2e.sh \
            --scenario "${{ matrix.scenario }}" \
            --frames "${{ inputs.e2e_frames }}" \
            --output-dir "../../e2e-results" \
            --skip-build \
            --verbose \
            --display ":99"

          # Stop monitoring
          kill $MONITOR_PID 2>/dev/null || true

          # Print resource summary
          echo "📊 Resource usage summary:"
          if [[ -f "$MONITOR_LOG" ]]; then
            echo "Peak memory usage:"
            awk -F',' 'NR>1 {if($6>max) max=$6} END {print "  " max " MB"}' "$MONITOR_LOG"
            echo "Average CPU idle:"
            awk -F',' 'NR>1 {sum+=$5; n++} END {print "  " sum/n "%"}' "$MONITOR_LOG"
          fi

      - name: Collect Test Artifacts 📋
        if: always()
        run: |
          : Collect Test Artifacts 📋

          mkdir -p e2e-artifacts

          # Collect test results
          if [[ -d e2e-results ]]; then
            cp -r e2e-results/* e2e-artifacts/
          fi

          # Collect MP4/AVI/WAV/CSV from test_output if present
          if [[ -d tests/e2e/test_output ]]; then
            mkdir -p e2e-artifacts/output
            cp -r tests/e2e/test_output/* e2e-artifacts/output/ 2>/dev/null || true
          fi

          # Collect plugin recording session folder if present
          if [[ -d "$HOME/Documents/obs-studio/c64stream/recordings" ]]; then
            mkdir -p e2e-artifacts/recordings
            cp -r "$HOME/Documents/obs-studio/c64stream/recordings"/* e2e-artifacts/recordings/ 2>/dev/null || true
          fi

          # Collect OBS logs
          if [[ -d ~/.config/obs-studio/logs ]]; then
            mkdir -p e2e-artifacts/obs-logs
            cp ~/.config/obs-studio/logs/* e2e-artifacts/obs-logs/ 2>/dev/null || true
          fi

          # Create summary
          echo "E2E Scenario Test Summary" > e2e-artifacts/summary.txt
          echo "Scenario: ${{ matrix.scenario }}" >> e2e-artifacts/summary.txt
          echo "Format: ${{ inputs.e2e_format }}" >> e2e-artifacts/summary.txt
          echo "Frames: ${{ inputs.e2e_frames }}" >> e2e-artifacts/summary.txt
          echo "Date: $(date)" >> e2e-artifacts/summary.txt

      - name: Upload E2E Artifacts 📤
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-full-${{ matrix.scenario }}-${{ needs.check-event.outputs.commitHash }}
          path: e2e-artifacts/
          if-no-files-found: warn

      - name: E2E Test Status Summary 📊
        if: always()
        run: |
          : E2E Test Status Summary 📊

          # Check if the E2E test step passed or failed
          if [[ "${{ steps.run_e2e.outcome }}" == "success" ]]; then
            echo "✅ **E2E Scenario '${{ matrix.scenario }}' PASSED**" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **E2E Scenario '${{ matrix.scenario }}' FAILED**" >> $GITHUB_STEP_SUMMARY
            echo "📦 Check E2E artifacts for debugging info." >> $GITHUB_STEP_SUMMARY
          fi

  # Consolidate all E2E artifacts into a single downloadable archive
  e2e-artifacts:
    name: E2E Artifacts 📦
    if: ${{ always() && inputs.run_e2e }}
    runs-on: ubuntu-24.04
    needs: [check-event, e2e-basic, e2e-full]
    steps:
      - name: Download All E2E Artifacts 📥
        uses: actions/download-artifact@v4
        with:
          pattern: e2e-*
          path: all-e2e-artifacts
          merge-multiple: false

      - name: Create Consolidated Archive 📦
        run: |
          : Create Consolidated Archive 📦

          echo "📁 Downloaded E2E artifacts:"
          find all-e2e-artifacts -type f | head -50

          # Create a summary of all results
          echo "# E2E Test Results Summary" > all-e2e-artifacts/SUMMARY.md
          echo "" >> all-e2e-artifacts/SUMMARY.md
          echo "Generated: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> all-e2e-artifacts/SUMMARY.md
          echo "Commit: ${{ needs.check-event.outputs.commitHash }}" >> all-e2e-artifacts/SUMMARY.md
          echo "" >> all-e2e-artifacts/SUMMARY.md
          echo "## Artifacts Included" >> all-e2e-artifacts/SUMMARY.md
          echo "" >> all-e2e-artifacts/SUMMARY.md
          for dir in all-e2e-artifacts/e2e-*/; do
            if [[ -d "$dir" ]]; then
              scenario=$(basename "$dir" | sed 's/e2e-full-//' | sed 's/e2e-basic-/basic-/' | sed "s/-${{ needs.check-event.outputs.commitHash }}//")
              echo "- $scenario" >> all-e2e-artifacts/SUMMARY.md
            fi
          done

          echo "✅ Consolidated $(find all-e2e-artifacts -type d -name 'e2e-*' | wc -l) E2E artifact directories"

      - name: Upload Consolidated E2E Artifacts 📤
        uses: actions/upload-artifact@v4
        with:
          name: e2e-all-results-${{ needs.check-event.outputs.commitHash }}
          path: all-e2e-artifacts/
          if-no-files-found: warn

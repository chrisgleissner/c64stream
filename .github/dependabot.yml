version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/.github/docker"
    schedule:
      interval: "weekly"

  - package-ecosystem: "pip"
    directory: "/tests/e2e"
    schedule:
      interval: "weekly"
    groups:
      e2e-python:
        patterns:
          - "*"

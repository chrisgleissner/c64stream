name: Bug report
description: Report a reproducible defect or regression
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report a bug.
        Please provide complete and accurate information so the issue can be reproduced and resolved efficiently.
        Incomplete reports may be closed as insufficient for diagnosis.

  - type: markdown
    attributes:
      value: |
        ## 1. C64 hardware

  - type: textarea
    id: c64_hardware
    attributes:
      label: C64 device and firmware
      description: Provide details about the Commodore 64 hardware used.
      placeholder: |
        Device model (e.g. Ultimate 64 Elite I/II, Commodore 64 Ultimate):
        Firmware version (e.g. 3.14):
        Additional hardware (if any):
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ## 2. OBS host system

  - type: textarea
    id: obs_host
    attributes:
      label: OBS host system details
      description: Provide details about the system running OBS.
      placeholder: |
        Operating system and version (e.g. Windows 11 23H2, Ubuntu 24.04.3, macOS 15.x):
        CPU (e.g. Intel i5 14600K, AMD Ryzen 9 9950X3D, Apple M2):
        GPU (e.g. built-in iGPU, NVIDIA GeForce RTX 5060):
        GPU driver version (if applicable):
        System RAM (e.g. 32 GB):
    validations:
      required: true

  - type: input
    id: obs_version
    attributes:
      label: OBS version
      placeholder: "e.g. 31.0.0"
    validations:
      required: true

  - type: input
    id: plugin_version
    attributes:
      label: Plugin version and installation method
      description: Specify whether this is a released build or a local source build.
      placeholder: "e.g. 1.2.3 - downloaded release / local build (commit hash)"
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ## 3. Network configuration

  - type: textarea
    id: network
    attributes:
      label: Network setup
      description: Describe the network topology between the C64 and the OBS host.
      placeholder: |
        Connection type (direct, via switch, via router):
        Network speed / bandwidth:
        Router or switch model:
        Wired or wireless:
        Other relevant network details:
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ## 4. Plugin configuration

        **Export your configuration:**
        1. Open the plugin properties dialog
        2. Scroll to the bottom to find the "Import/Export" section
        3. Click the **Export** button and save the configuration file
        4. Attach the exported `.ini` file below

        Configuration exports contain all plugin settings in a text format that helps with diagnosis.
        Issues missing configuration exports may be closed as incomplete.

  - type: textarea
    id: plugin_configuration_file
    attributes:
      label: Plugin configuration export
      description: |
        Attach the exported configuration file (.ini) from the plugin properties.

        To export:
        1. Open C64 Stream properties
        2. Find "Import/Export" at the bottom
        3. Click "Export" button
        4. Save and attach the file here

      placeholder: |
        Drag and drop the exported .ini file here.
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ## 5. Logs and reproduction

  - type: textarea
    id: logs
    attributes:
      label: OBS logs (verbose logging enabled)
      description: Attach or paste logs generated with verbose logging enabled.
      placeholder: "Paste logs here or drag-and-drop log files."
      render: text
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Provide exact steps to reliably reproduce the issue.
      placeholder: |
        1.
        2.
        3.

        Expected result:
        Actual result:
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ## 6. Diagnostics

  - type: textarea
    id: diagnosis
    attributes:
      label: Diagnostics already performed
      description: Include any troubleshooting, testing, or analysis already carried out.
      placeholder: |
        - Tests performed:
        - Observations:
        - Suspected cause (if any):
    validations:
      required: true

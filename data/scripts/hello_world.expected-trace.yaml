# Execution trace
script: "hello_world.c64script"
status: success
error: ~
program: |
  01: REM ================================================
  02: REM Hello World - Your First C64Script
  03: REM ================================================
  04: REM This simple script demonstrates basic features:
  05: REM - Variables and arithmetic
  06: REM - Text output to the OBS log
  07: REM - Waiting/delays
  08: REM - Basic control flow
  09: REM ================================================
  10: 
  11: REM Initialize a counter variable
  12: COUNTER = 0
  13: 
  14: REM Display a welcome message
  15: LOG "=== Hello World Script Started ==="
  16: LOG "Welcome to C64Script!"
  17: LOG ""
  18: 
  19: REM Main loop - count from 1 to 5
  20: LABEL counting_loop
  21:     COUNTER = COUNTER + 1
  22:     LOG "Count: " + STR(COUNTER)
  23:     
  24:     REM Wait half a second between counts
  25:     WAIT 500ms
  26:     
  27:     REM Check if we've reached 5
  28:     IF COUNTER < 5 THEN
  29:         GOTO counting_loop
  30:     ENDIF
  31: 
  32: REM Final message
  33: LOG ""
  34: LOG "=== Counting Complete! ==="
  35: LOG "Final counter value: " + STR(COUNTER)
  36: 
  37: REM That's it! Check the OBS log to see the output.
  38: REM Try using the debug controls to step through line-by-line!

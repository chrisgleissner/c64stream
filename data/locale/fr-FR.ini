# Network
NetworkConfiguration="Configuration Réseau"

DNSServerIP="IP du Serveur DNS"
DNSServerIP.Description="Adresse IP du serveur DNS pour résoudre les noms d'hôtes des appareils (par défaut : 192.168.1.1 pour la plupart des routeurs)"

C64UHost="Hôte C64U"
C64UHost.Description="Nom d'hôte ou adresse IP du périphérique C64 Ultimate (par défaut : c64u). Utilisez 0.0.0.0 pour ignorer les commandes de contrôle."

OBSMachineIP="IP OBS"
OBSMachineIP.Description="Adresse IP de ce serveur OBS (où C64 Ultimate envoie les flux)"

AutoDetectOBSIP="Détecter automatiquement l'IP OBS"
AutoDetectOBSIP.Description="Détecter automatiquement et utiliser l'IP du serveur OBS dans les commandes de streaming"

VideoPort="Port vidéo"
VideoPort.Description="Port UDP pour le flux vidéo du C64 Ultimate"

AudioPort="Port audio"
AudioPort.Description="Port UDP pour le flux audio du C64 Ultimate"

ControlPort="Port de contrôle"
ControlPort.Description="Port TCP utilisé pour envoyer des commandes de contrôle au C64 Ultimate (par défaut : 64)"

BufferDelay="Délai de tampon (millis)"
BufferDelay.Description="Délai de tampon en millisecondes pour compenser la gigue des paquets UDP (défaut : 50)"

# Recording
Recording="Enregistrement"

OutputFolder="Dossier de sortie"
OutputFolder.Description="Répertoire où les dossiers de session avec images, vidéo, audio et fichiers de timing seront créés"

RecordRawVideo="Enregistrer vidéo brute (AVI) et audio (WAV)"
RecordRawVideo.Description="Enregistrer vidéo AVI non compressée + audio WAV (pour débogage - utilisation disque élevée)"

RecordRawFrames="Enregistrer images brutes (BMP)"
RecordRawFrames.Description="Sauvegarder chaque image en BMP dans le sous-dossier frames/ (pour débogage - impacte les performances)"

RecordNetworkEvents="Enregistrer événements réseau et streaming (CSV)"
RecordNetworkEvents.Description="Créer des fichiers CSV avec détails de timing réseau et OBS (pour débogage - crée obs.csv et network.csv)"

ShowDebugMessages="Afficher les messages de débogage dans les journaux OBS"
ShowDebugMessages.Description="Activer la journalisation détaillée pour déboguer les problèmes de connexion"

# Effects
Presets.Description="Sélectionnez un préréglage d'effets visuels pour appliquer des paramètres de simulation CRT prédéfinis"

ScanLineDistance="Distance entre les lignes de balayage (scan lines)"
ScanLineDistance.Description="Rapport de hauteur entre les espaces des lignes de balayage et les lignes de balayage. Chaque ligne individuelle est suivie d'exactement un espace. 0% = pas d'espaces, 50% = espace moitié moins haut que la ligne, 100% = espace de même hauteur que la ligne."
ScanLineDistance.None="Aucune (0%)"
ScanLineDistance.Tight="Serrée (25%)"
ScanLineDistance.Normal="Normale (50%)"
ScanLineDistance.Wide="Large (100%)"
ScanLineDistance.ExtraWide="Extra large (200%)"

ScanLineStrength="Intensité des lignes de balayage"
ScanLineStrength.Description="Contrôle la noirceur des écarts entre les lignes de balayage. 0,0 = les écarts sont aussi lumineux que les lignes de balayage (aucun effet), 1,0 = les écarts sont complètement noirs."

PixelWidth="Largeur de pixel"
PixelWidth.Description="Multiplicateur de taille horizontale des pixels"

PixelHeight="Hauteur de pixel"
PixelHeight.Description="Multiplicateur de taille verticale des pixels"

BlurStrength="Flou"
BlurStrength.Description="Flou de mise à l'échelle (0,0 = mise à l'échelle précise, 1,0 = très flou avec flou gaussien)"

BloomStrength="Intensité de l'éclat"
BloomStrength.Description="Intensité de l'effet d'éclat (0,0 = désactivé, 1,0 = maximum)"

AfterglowDuration="Durée de la persistance (ms)"
AfterglowDuration.Description="Durée de persistance du phosphore (0 = désactivé)"

AfterglowCurve="Courbe de persistance"
AfterglowCurve.Description="À quelle vitesse la persistance s'estompe"
AfterglowCurve.InstantFade="Fondu instantané (Linéaire)"
AfterglowCurve.GradualFade="Fondu graduel (Démarrage lent)"
AfterglowCurve.RapidFade="Fondu rapide (Démarrage rapide)"
AfterglowCurve.LongTail="Longue traînée (Exponentielle)"

TintMode="Type de teinte"
TintMode.Description="Type de teinte monochrome à appliquer"
TintMode.None="Aucune (couleur)"
TintMode.Amber="Ambre"
TintMode.Green="Vert"
TintMode.Monochrome="Monochrome"

TintStrength="Intensité de la teinte"
TintStrength.Description="Intensité de l'effet de teinte (0,0 = désactivé, 1,0 = teinte complète)"

# Palette
Palette="Palettes"
PaletteSelection="Palette"
PaletteSelection.Description="Sélectionnez une palette de couleurs pour la sortie vidéo C64. Palettes fournies : Default (originale), Vibrant (saturée), Muted (douce), Warm (chaude), Cool (froide)."
PaletteImport="Importer une palette"
PaletteImport.Description="Sélectionnez un fichier de palette .vpl pour l'importer et l'appliquer."
PaletteExport="Exporter la palette"
PaletteExport.Description="Choisissez un chemin de destination pour enregistrer la palette actuelle en fichier .vpl."
PaletteDelete="Supprimer"
PaletteColorEditor="Éditeur de Couleurs"
# Remote Control
RemoteControl="Contrôle à distance"
RESTPassword="Mot de passe"
RESTPassword.Description="Mot de passe de l'API REST pour s'authentifier avec Ultimate 64 (en-tête X-Password). Laisser vide si l'authentification est désactivée."
KeyboardCaptureEnabled="Activer la capture du clavier"
KeyboardCaptureEnabled.Description="Capturer l'entrée clavier de la fenêtre de prévisualisation OBS et injecter les frappes dans le C64 via l'API REST. Appuyez sur ESC pour désactiver la capture."
KeyboardKeymap="Mappage clavier"
KeyboardKeymap.Description="Sélectionnez le mappage de clavier pour convertir les frappes PC en codes PETSCII C64. Les mappages symboliques correspondent aux étiquettes des touches (ex., Q→Q). Les mappages positionnels correspondent aux emplacements physiques des touches."
AutomationMode="Mode d'automatisation"
AutomationMode.Description="Lecture automatisée des fichiers de contenu C64 (.sid, .prg, .d64). Désactivé : pas d'automatisation. Fichier unique : lire un fichier. Dossier : énumérer et lire tous les fichiers compatibles."
AutomationMode.Disabled="Désactivé"
AutomationMode.SingleFile="Fichier unique"
AutomationMode.Folder="Dossier"
AutomationPath="Chemin d'automatisation"
AutomationPath.Description="Chemin de fichier ou de dossier pour la lecture automatisée. Pour le mode fichier unique, sélectionnez un fichier .sid, .prg ou .d64. Pour le mode dossier, sélectionnez un répertoire contenant de tels fichiers."
AutomationShuffle="Mélanger les fichiers"
AutomationShuffle.Description="Randomiser l'ordre de lecture lors de l'utilisation du mode d'automatisation de dossier (algorithme de mélange Fisher-Yates)"
AutomationDuration="Durée par élément (secondes)"
AutomationDuration.Description="Combien de temps lire chaque fichier avant de passer au suivant (1-3600 secondes, par défaut 120)"
AutomationReset="Réinitialiser entre les éléments"
AutomationReset.Description="Effectuer une réinitialisation logicielle (C64 RESET) entre les fichiers pour garantir un état propre pour chaque élément"

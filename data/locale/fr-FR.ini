VideoPort.Description="Port UDP pour le flux vidéo du C64 Ultimate"

AudioPort="Port audio"
AudioPort.Description="Port UDP pour le flux audio du C64 Ultimate"

ControlPort="Port de contrôle"
ControlPort.Description="Port TCP utilisé pour envoyer des commandes de contrôle au C64 Ultimate (par défaut : 64)"

BufferDelay="Délai de tampon (millis)"
BufferDelay.Description="Délai de tampon en millisecondes pour compenser la gigue des paquets UDP (défaut : 50)"

# Recording
Recording="Enregistrement"


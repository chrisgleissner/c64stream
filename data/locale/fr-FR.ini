# Network
NetworkConfiguration="Configuration Réseau"

DNSServerIP="IP du Serveur DNS"
DNSServerIP.Description="Adresse IP du serveur DNS pour résoudre les noms d'hôtes des appareils (par défaut : 192.168.1.1 pour la plupart des routeurs)"

C64UHost="Hôte C64U"
C64UHost.Description="Nom d'hôte ou adresse IP du périphérique C64 Ultimate (par défaut : c64u). Utilisez 0.0.0.0 pour ignorer les commandes de contrôle."

C64UPassword="Mot de passe C64U"
C64UPassword.Description="Mot de passe réseau du dispositif C64U. Nécessaire uniquement si l'API REST C64U a été sécurisée avec un mot de passe. Par défaut, aucun mot de passe n'est défini, donc cela peut rester vide."

OBSMachineIP="IP OBS"
OBSMachineIP.Description="Adresse IP de ce serveur OBS (où C64 Ultimate envoie les flux)"


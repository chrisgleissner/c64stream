# Effects
Presets.Description="Sélectionnez un préréglage d'effets visuels pour appliquer des paramètres de simulation CRT prédéfinis"

ScanLineDistance="Distance entre les lignes de balayage (scan lines)"
ScanLineDistance.Description="Rapport de hauteur entre les espaces des lignes de balayage et les lignes de balayage. Chaque ligne individuelle est suivie d'exactement un espace. 0% = pas d'espaces, 50% = espace moitié moins haut que la ligne, 100% = espace de même hauteur que la ligne."
ScanLineDistance.None="Aucune (0%)"
ScanLineDistance.Tight="Serrée (25%)"
ScanLineDistance.Normal="Normale (50%)"
ScanLineDistance.Wide="Large (100%)"
ScanLineDistance.ExtraWide="Extra large (200%)"

ScanLineStrength="Intensité des lignes de balayage"
ScanLineStrength.Description="Contrôle la noirceur des écarts entre les lignes de balayage. 0,0 = les écarts sont aussi lumineux que les lignes de balayage (aucun effet), 1,0 = les écarts sont complètement noirs."


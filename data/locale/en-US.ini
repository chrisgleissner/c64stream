# Network
NetworkConfiguration="Network"

DNSServerIP="DNS Server IP"
DNSServerIP.Description="IP address of DNS server for resolving device hostnames (default: 192.168.1.1 for most routers)"

C64UHost="C64U Host"
C64UHost.Description="Hostname or IP address of C64 Ultimate device (default: c64u). Use 0.0.0.0 to skip control commands."

C64UPassword="C64U Password"
C64UPassword.Description="Network password of the C64U device. Only needed if the C64U REST API was secured with a password. By default, no password is set, so this can be left empty."

OBSMachineIP="OBS IP"
OBSMachineIP.Description="IP address of this OBS server (where C64 Ultimate sends streams)"

AutoDetectOBSIP="Auto-detect OBS IP"
AutoDetectOBSIP.Description="Automatically detect and use OBS server IP in streaming commands"

VideoPort="Video Port"
VideoPort.Description="UDP port for video stream from C64 Ultimate"

AudioPort="Audio Port"
AudioPort.Description="UDP port for audio stream from C64 Ultimate"

ControlPort="Control Port"
ControlPort.Description="TCP port used to send control commands to C64 Ultimate (default: 64)"

BufferDelay="Buffer Delay (millis)"
BufferDelay.Description="Buffer network packets for specified milliseconds to smooth UDP packet loss/jitter (default: 10ms)"

# Recording
Recording="Recording"

OutputFolder="Output Folder"
OutputFolder.Description="Directory where session folders with frames, video, audio, and timing files will be created"

RecordRawVideo="Record Raw Video (AVI) and Audio (WAV)"
RecordRawVideo.Description="Record uncompressed AVI video + WAV audio (for debugging - high disk usage)"

RecordRawFrames="Record Raw Frames (BMP)"
RecordRawFrames.Description="Save each frame as BMP in frames/ subfolder (for debugging - impacts performance)"

RecordNetworkEvents="Record Network and Streaming Events (CSV)"
RecordNetworkEvents.Description="Create CSV files with network and OBS timing details (for debugging - creates obs.csv and network.csv)"

RecordAVSync="Record A/V Sync (CSV)"
RecordAVSync.Description="Create av-sync.csv and trigger the A/V sync test PRG run/reset via Ultimate 64 REST API (debugging)."

ShowDebugMessages="Show Debug Messages in OBS Logs"
ShowDebugMessages.Description="Enable detailed logging for debugging connection issues"

# Effects
Presets.Description="Select a visual effect preset"

ScanLineDistance="Scan Line Distance"
ScanLineDistance.Description="Controls the dark gap between each pair of C64 pixel rows. Tight (25%): 5× scale, subtle gaps. Normal (50%): 3× scale, classic CRT look with black bars. Wide (100%): 4× scale, fills 1080p canvas. Extra Wide (200%): 3× scale, prominent gaps."
ScanLineDistance.None="None (0%)"
ScanLineDistance.Tight="Tight (25%)"
ScanLineDistance.Normal="Normal (50%)"
ScanLineDistance.Wide="Wide (100%)"
ScanLineDistance.ExtraWide="Extra Wide (200%)"

ScanLineStrength="Scan Line Strength"
ScanLineStrength.Description="How dark the gaps between scan lines appear. 0.0 = gaps invisible (no effect), 0.7 = recommended, 1.0 = gaps completely black."

PixelWidth="Pixel Width"
PixelWidth.Description="Horizontal pixel size multiplier"

PixelHeight="Pixel Height"
PixelHeight.Description="Vertical pixel size multiplier"

PreservePreviewSize="Preserve preview size"
PreservePreviewSize.Description="Keep the OBS preview footprint stable when effect scaling changes pixel geometry. Disable this to keep the legacy size-changing behavior."

BlurStrength="Blur"
BlurStrength.Description="Scaling blur (0.0 = precise scaling, 1.0 = very blurry with gaussian blur). GPU multi-sample effect."

BloomStrength="Bloom"
BloomStrength.Description="Bloom effect strength (0.0 = off, 1.0 = maximum). GPU multi-pass effect."

AfterglowDuration="Afterglow Duration (ms)"
AfterglowDuration.Description="Phosphor persistence duration (0 = off). High CPU impact: processes every pixel every frame. Disable for best performance."

AfterglowCurve="Afterglow Curve"
AfterglowCurve.Description="How quickly the afterglow fades away"
AfterglowCurve.InstantFade="Instant Fade (Linear)"
AfterglowCurve.GradualFade="Gradual Fade (Slow Start)"
AfterglowCurve.RapidFade="Rapid Fade (Fast Start)"
AfterglowCurve.LongTail="Long Tail (Exponential)"

TintMode="Tint Type"
TintMode.Description="Type of monochrome tint to apply. GPU shader effect."
TintMode.None="None (colour)"
TintMode.Amber="Amber"
TintMode.Green="Green"
TintMode.Monochrome="Monochrome"

TintStrength="Tint Strength"
TintStrength.Description="Strength of tint effect (0.0 = off, 1.0 = full tint). GPU shader effect."


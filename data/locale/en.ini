ControlPort.Description="TCP port used to send control commands to C64 Ultimate (default: 64)"

BufferDelay="Buffer Delay (millis)"
BufferDelay.Description="Buffer network packets for specified milliseconds to smooth UDP packet loss/jitter (default: 10ms)"

# Recording
Recording="Recording"

OutputFolder="Output Folder"
OutputFolder.Description="Directory where session folders with frames, video, audio, and timing files will be created"

RecordRawVideo="Record Raw Video (AVI) and Audio (WAV)"
RecordRawVideo.Description="Record uncompressed AVI video + WAV audio (for debugging - high disk usage)"

RecordRawFrames="Record Raw Frames (BMP)"
RecordRawFrames.Description="Save each frame as BMP in frames/ subfolder (for debugging - impacts performance)"

RecordNetworkEvents="Record Network and Streaming Events (CSV)"
RecordNetworkEvents.Description="Create CSV files with network and OBS timing details (for debugging - creates obs.csv and network.csv)"

ShowDebugMessages="Show Debug Messages in OBS Logs"
ShowDebugMessages.Description="Enable detailed logging for debugging connection issues"

# Effects
Presets.Description="Select a visual effect preset"

ScanLineDistance="Scan Line Distance"
ScanLineDistance.Description="Controls the dark gap between each pair of C64 pixel rows. Tight (25%): 5× scale, subtle gaps. Normal (50%): 3× scale, classic CRT look with black bars. Wide (100%): 4× scale, fills 1080p canvas. Extra Wide (200%): 3× scale, prominent gaps."
ScanLineDistance.None="None (0%)"
ScanLineDistance.Tight="Tight (25%)"
ScanLineDistance.Normal="Normal (50%)"
ScanLineDistance.Wide="Wide (100%)"
ScanLineDistance.ExtraWide="Extra Wide (200%)"

ScanLineStrength="Scan Line Strength"
ScanLineStrength.Description="How dark the gaps between scan lines appear. 0.0 = gaps invisible (no effect), 0.7 = recommended, 1.0 = gaps completely black."

PixelWidth="Pixel Width"
PixelWidth.Description="Horizontal pixel size multiplier"

PixelHeight="Pixel Height"
PixelHeight.Description="Vertical pixel size multiplier"

BlurStrength="Blur"
BlurStrength.Description="Scaling blur (0.0 = precise scaling, 1.0 = very blurry with gaussian blur). GPU multi-sample effect."

BloomStrength="Bloom"
BloomStrength.Description="Bloom effect strength (0.0 = off, 1.0 = maximum). GPU multi-pass effect."

AfterglowDuration="Afterglow Duration (ms)"
AfterglowDuration.Description="Phosphor persistence duration (0 = off). High CPU impact: processes every pixel every frame. Disable for best performance."

AfterglowCurve="Afterglow Curve"
AfterglowCurve.Description="How quickly the afterglow fades away"
AfterglowCurve.InstantFade="Instant Fade (Linear)"
AfterglowCurve.GradualFade="Gradual Fade (Slow Start)"
AfterglowCurve.RapidFade="Rapid Fade (Fast Start)"
AfterglowCurve.LongTail="Long Tail (Exponential)"

TintMode="Tint Type"
TintMode.Description="Type of monochrome tint to apply. GPU shader effect."
TintMode.None="None (colour)"
TintMode.Amber="Amber"
TintMode.Green="Green"
TintMode.Monochrome="Monochrome"

TintStrength="Tint Strength"
TintStrength.Description="Strength of tint effect (0.0 = off, 1.0 = full tint). GPU shader effect."

# Palette
Palette="Palettes"
PaletteSelection="Palette"
PaletteSelection.Description="Select a color palette for the C64 video output. Shipped palettes show '(Preset)' suffix. Custom palettes are saved automatically when closing the properties dialog."
PaletteImport="Import palette"
PaletteImport.Description="Select a .vpl palette file to import and apply it."
PaletteExport="Export palette"
PaletteExport.Description="Choose a destination path to save the current palette as a .vpl file."
PaletteDelete="Delete"
PaletteColorEditor="Color Editor"

# Remote Control
RemoteControl="Remote Control"
RESTPassword="Password"
RESTPassword.Description="REST API password for authenticating with Ultimate 64 (X-Password header). Leave empty if authentication is disabled."
KeyboardCaptureEnabled="Enable Keyboard Capture"
KeyboardCaptureEnabled.Description="Capture keyboard input from OBS preview window and inject keystrokes into C64 via REST API. Press ESC to disable capture."
KeyboardKeymap="Keymap"
KeyboardKeymap.Description="Select the keyboard mapping to use for converting PC keystrokes to C64 PETSCII codes. Symbolic keymaps match key labels (e.g., Q→Q). Positional keymaps match physical key locations."
AutomationMode="Automation Mode"
AutomationMode.Description="Automated playback of C64 content files (.sid, .prg, .d64). Disabled: no automation. Single File: play one file. Folder: enumerate and play all compatible files."
AutomationMode.Disabled="Disabled"
AutomationMode.SingleFile="Single File"
AutomationMode.Folder="Folder"
FileSource="File Source"
FileSource.Description="Choose where automation files are located. Local Filesystem: files on this computer. C64U Filesystem: files on Ultimate 64 device accessed via REST API."
FileSource.Local="Local Filesystem"
FileSource.C64U="C64U Filesystem"
AutomationPath="Automation Path"
AutomationPath.Description="File or folder path for automated playback. For Single File mode, select a .sid, .prg, or .d64 file. For Folder mode, select a directory containing such files."
AutomationShuffle="Shuffle Files"
AutomationShuffle.Description="Randomize playback order when using Folder automation mode (Fisher-Yates shuffle algorithm)"
AutomationDuration="Duration per Item (seconds)"
AutomationDuration.Description="How long to play each file before advancing to the next (1-3600 seconds, default 120)"
AutomationReset="Reset Between Items"
AutomationReset.Description="Perform soft reset (C64 RESET) between files to ensure clean state for each item"
ScriptEnabled="Enable Script Automation"
ScriptEnabled.Description="Execute a .c64script file with automated commands (effects, palettes, playback, wait times, etc.)"
ScriptFile="Script File"
ScriptFile.Description="Path to .c64script file with automation commands. Scripts can change effects, palettes, play files, and control timing."
ScriptStatus="Script Status"
ScriptStatus.Description="Current execution status of the script (idle, running, waiting, completed, or error)"

AutomationPath.Description="Ruta de archivo o carpeta para reproducción automatizada. Para modo de archivo único, seleccione un archivo .sid, .prg o .d64. Para modo de carpeta, seleccione un directorio que contenga dichos archivos."
AutomationShuffle="Mezclar archivos"
AutomationShuffle.Description="Aleatorizar el orden de reproducción cuando se usa el modo de automatización de carpeta (algoritmo de mezcla Fisher-Yates)"
AutomationDuration="Duración por elemento (segundos)"
AutomationDuration.Description="Cuánto tiempo reproducir cada archivo antes de avanzar al siguiente (1-3600 segundos, predeterminado 120)"

Presets.Description="Wybierz ustawienie wstępne efektów wizualnych, aby zastosować predefiniowane ustawienia symulacji CRT"

ScanLineDistance="Odległość między liniami skanowania (scan lines)"
ScanLineDistance.Description="Stosunek wysokości przerw w liniach skanowania do linii skanowania. Każda pojedyncza linia skanowania jest następowana przez dokładnie jedną przerwę. 0% = brak przerw, 50% = przerwa połowa wysokości linii, 100% = przerwa tej samej wysokości co linia."
ScanLineDistance.None="Brak (0%)"

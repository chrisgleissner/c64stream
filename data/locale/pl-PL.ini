# Remote Control
RemoteControl="Zdalne sterowanie"
RESTPassword="Hasło"
RESTPassword.Description="Hasło API REST do uwierzytelniania z Ultimate 64 (nagłówek X-Password). Pozostaw puste, jeśli uwierzytelnianie jest wyłączone."
KeyboardCaptureEnabled="Włącz przechwytywanie klawiatury"
KeyboardCaptureEnabled.Description="Przechwytuj dane wejściowe z klawiatury z okna podglądu OBS i wstrzykuj naciśnięcia klawiszy do C64 przez API REST. Naciśnij ESC, aby wyłączyć przechwytywanie."
KeyboardKeymap="Układ klawiatury"
KeyboardKeymap.Description="Wybierz mapowanie klawiatury do konwersji naciśnięć klawiszy PC na kody PETSCII C64. Mapy symboliczne odpowiadają etykietom klawiszy (np. Q→Q). Mapy pozycyjne odpowiadają fizycznym położeniom klawiszy."
AutomationMode="Tryb automatyzacji"
AutomationMode.Description="Automatyczne odtwarzanie plików zawartości C64 (.sid, .prg, .d64). Wyłączony: brak automatyzacji. Pojedynczy plik: odtwórz jeden plik. Folder: wylicz i odtwórz wszystkie kompatybilne pliki."
AutomationMode.Disabled="Wyłączony"
AutomationMode.SingleFile="Pojedynczy plik"
AutomationMode.Folder="Folder"
FileSource="Źródło plików"
FileSource.Description="Wybierz, gdzie znajdują się pliki automatyzacji. Lokalny system plików: pliki na tym komputerze. System plików C64U: pliki na urządzeniu Ultimate 64 dostępne przez REST API."
FileSource.Local="Lokalny system plików"
FileSource.C64U="System plików C64U"
AutomationPath="Ścieżka automatyzacji"
AutomationPath.Description="Ścieżka pliku lub folderu do automatycznego odtwarzania. W trybie pojedynczego pliku wybierz plik .sid, .prg lub .d64. W trybie folderu wybierz katalog zawierający takie pliki."
AutomationShuffle="Tasowanie plików"
AutomationShuffle.Description="Randomizuj kolejność odtwarzania podczas korzystania z trybu automatyzacji folderu (algorytm tasowania Fisher-Yates)"
AutomationDuration="Czas trwania na element (sekundy)"
AutomationDuration.Description="Jak długo odtwarzać każdy plik przed przejściem do następnego (1-3600 sekund, domyślnie 120)"
AutomationReset="Resetuj między elementami"
AutomationReset.Description="Wykonaj miękki reset (C64 RESET) między plikami, aby zapewnić czysty stan dla każdego elementu"
ScriptEnabled="Włącz automatyzację skryptów"
ScriptEnabled.Description="Wykonaj plik .c64script z automatycznymi poleceniami (efekty, palety, odtwarzanie, czasy oczekiwania itp.)"
ScriptFile="Plik skryptu"
ScriptFile.Description="Ścieżka do pliku .c64script z poleceniami automatyzacji. Skrypty mogą zmieniać efekty, palety, odtwarzać pliki i kontrolować czas."

# C64 Stream CRT Effect Presets
#
# This file defines visual effect presets that users can select from the Effects dropdown.
# Each preset is a section [Preset Name] followed by key=value pairs for each effect setting.
#
# ═══════════════════════════════════════════════════════════════════════════════
# PERFORMANCE IMPACT
# ═══════════════════════════════════════════════════════════════════════════════
# CPU Impact Key:  ○ = None, ◐ = Low, ● = Medium, ●● = High
# GPU Impact Key:  ○ = None, ◐ = Low, ● = Medium, ●● = High
#
# Effect                  CPU    GPU    Notes
# ─────────────────────── ────── ────── ─────────────────────────────────────────
# scan_line_distance      ○      ◐      GPU shader only
# scan_line_strength      ○      ◐      GPU shader only
# pixel_width/height      ○      ◐      GPU scaling
# blur_strength           ○      ●      GPU gaussian blur (multiple samples)
# bloom_strength          ○      ●      GPU multi-pass bloom
# afterglow_duration_ms   ●●     ○      CPU per-pixel loop (~92k pixels/frame)
# afterglow_curve         ◐      ○      Affects CPU afterglow math complexity
# tint_mode               ○      ◐      GPU color transformation
# tint_strength           ○      ◐      GPU color transformation
#
# Preset Performance Summary:
# ─────────────────────────────────────────────────────────────────────────────
# Default         CPU: ○   GPU: ○   Minimal processing
# Sharp Pixels    CPU: ○   GPU: ◐   Only pixel scaling
# Classic CRT     CPU: ○   GPU: ●   Scanlines + blur + bloom (no afterglow)
# Arcade Cabinet  CPU: ○   GPU: ●   Scanlines + bloom (no afterglow)
# Green Monitor   CPU: ●●  GPU: ●   Tinting + scanlines + afterglow (100ms)
# Amber Monitor   CPU: ●●  GPU: ●   Tinting + scanlines + afterglow (80ms)
# Phosphor Glow   CPU: ●   GPU: ●●  Bloom + blur + afterglow (40ms)
# Vintage TV      CPU: ●●  GPU: ●●  All effects + afterglow (80ms)
# ═══════════════════════════════════════════════════════════════════════════════
#
# Available settings:
#   scan_line_distance    - Gap between scan lines as percentage (0.0-2.0)
#   scan_line_strength    - Darkness of gaps between scan lines (0.0-1.0)
#   pixel_width           - Horizontal pixel size multiplier (0.5-4.0)
#   pixel_height          - Vertical pixel size multiplier (0.5-4.0)
#   blur_strength         - Scaling blur amount (0.0-1.0)
#   bloom_strength        - Bloom effect strength (0.0-1.0)
#   afterglow_duration_ms - Phosphor persistence in milliseconds (0-250)
#   afterglow_curve       - Decay curve type (0-3)
#   tint_mode             - Tint type (0=None, 1=Amber, 2=Green, 3=Monochrome)
#   tint_strength         - Strength of tint effect (0.0-1.0)


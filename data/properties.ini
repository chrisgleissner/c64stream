# C64 Stream Plugin Configuration
#
# This file contains default configuration values for the C64 Stream OBS plugin.
# These values are loaded when the plugin initializes and can be overridden by
# user settings in OBS.
#
# Configuration values should match the property names used in c64-properties.c
#

[network]
# Default C64 Ultimate hostname or IP address
# For E2E testing: use "localhost" to connect to test server
# For production: use "c64u" (default) or actual C64 Ultimate IP
c64_host=c64u

# Optional Ultimate 64 REST password (sent as X-Password header when present)
c64_password=

# Default DNS server for hostname resolution
dns_server_ip=192.168.1.1

# Default UDP ports for video and audio streams
video_port=11000
audio_port=11001

# Control port for C64 Ultimate TCP commands (default 64, configurable for testing)
control_port=64

# Whether to auto-detect OBS machine IP address
auto_detect_ip=true

# Default buffer delay in milliseconds
buffer_delay_ms=10

[recording]
# Default output folder for recordings (platform-specific paths will be used if empty)
save_folder=

# Default recording options
record_frames=false
record_video=false
record_csv=false
record_av_sync=false

[debug]
# Disable debug logging by default
debug_logging=false

[effects]
# Default CRT effect values
scan_line_distance=0.0
scan_line_strength=0.0
pixel_width=1.0
pixel_height=1.0
blur_strength=0.0
bloom_strength=0.0
afterglow_duration_ms=0
afterglow_curve=2
tint_mode=0
tint_strength=0.0

[automation]
# File system: 0=Local computer, 1=C64 Ultimate
file_system=0

# Playback source: 0=Single file, 1=Folder
playback_source=0

# Path properties (only relevant one is used based on file_system and playback_source)
local_file_path=
local_folder_path=
c64u_file_path=c64u:/
c64u_folder_path=c64u:/

# Folder playback options
include_subfolders=false
shuffle_playback=true

# Playback settings
automation_duration=120
automation_reset=true

[script]
# Script automation settings
script_file=
script_auto_start=false

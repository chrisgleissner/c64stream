# C64 Symbolic German Keymap
# Based on symbolic_us with German-specific additions only.
#
# Normalization policy: accented Latin characters normalize to their PETSCII
# base letter. For example: ä→A (0x41/0xC1), ö→O (0x4F/0xCF).

[meta]
name=Symbolic DE
description=Symbolic mapping for German (DE) keyboards (text-first)
language=de
type=symbolic

[map]
# Lowercase letters
a=0x41
b=0x42
c=0x43
d=0x44
e=0x45
f=0x46
g=0x47
h=0x48
i=0x49
j=0x4A
k=0x4B
l=0x4C
m=0x4D
n=0x4E
o=0x4F
p=0x50
q=0x51
r=0x52
s=0x53
t=0x54
u=0x55
v=0x56
w=0x57
x=0x58
y=0x59
z=0x5A

# Uppercase letters
A=0xC1
B=0xC2
C=0xC3
D=0xC4
E=0xC5
F=0xC6
G=0xC7
H=0xC8
I=0xC9
J=0xCA
K=0xCB
L=0xCC
M=0xCD
N=0xCE
O=0xCF
P=0xD0
Q=0xD1
R=0xD2
S=0xD3
T=0xD4
U=0xD5
V=0xD6
W=0xD7
X=0xD8
Y=0xD9
Z=0xDA

# Numbers
0=0x30
1=0x31
2=0x32
3=0x33
4=0x34
5=0x35
6=0x36
7=0x37
8=0x38
9=0x39

# Special characters
space=0x20
!=0x21
"=0x22
#=0x23
$=0x24
%=0x25
&=0x26
'=0x27
(=0x28
)=0x29
*=0x2A
+=0x2B
,=0x2C
-=0x2D
.=0x2E
/=0x2F
:=0x3A
;=0x3B
<=0x3C
==0x3D
>=0x3E
?=0x3F
@=0x40
[=0x5B
]=0x5D
^=0x5E
`=0x5F

# Locale-specific additions (differences vs Symbolic US)
ä=0x41
ö=0x4F
ü=0x55
Ä=0xC1
Ö=0xCF
Ü=0xD5
ß=0x53
§=0x23
£=0x5C

# Control characters
Ctrl+KeyA=0x01
Ctrl+KeyB=0x02
Ctrl+KeyC=0x03
Ctrl+KeyD=0x04
Ctrl+KeyE=0x05
Ctrl+KeyF=0x06
Ctrl+KeyG=0x07
Ctrl+KeyH=0x08
Ctrl+KeyI=0x09
Ctrl+KeyJ=0x0A
Ctrl+KeyK=0x0B
Ctrl+KeyL=0x0C
Ctrl+KeyM=0x0D
Ctrl+KeyN=0x0E
Ctrl+KeyO=0x0F
Ctrl+KeyP=0x10
Ctrl+KeyQ=0x11
Ctrl+KeyR=0x12
Ctrl+KeyS=0x13
Ctrl+KeyT=0x14
Ctrl+KeyU=0x15
Ctrl+KeyV=0x16
Ctrl+KeyW=0x17
Ctrl+KeyX=0x18
Ctrl+KeyY=0x19
Ctrl+KeyZ=0x1A

# Color codes
Ctrl+Digit1=0x90
Ctrl+Digit2=0x05
Ctrl+Digit3=0x1C
Ctrl+Digit4=0x9F
Ctrl+Digit5=0x9C
Ctrl+Digit6=0x1E
Ctrl+Digit7=0x1F
Ctrl+Digit8=0x9E
Ctrl+Digit9=0x12
Ctrl+Digit0=0x92

# Color codes (CBM / Alt+number)
# On a real C64: Ctrl+1..8 selects colors 0..7, CBM+1..8 selects colors 8..15.
Alt+Digit1=0x81
Alt+Digit2=0x95
Alt+Digit3=0x96
Alt+Digit4=0x97
Alt+Digit5=0x98
Alt+Digit6=0x99
Alt+Digit7=0x9A
Alt+Digit8=0x9B

# Function keys
F1=0x85
F2=0x89
F3=0x86
F4=0x8A
F5=0x87
F6=0x8B
F7=0x88
F8=0x8C

# Cursor movement
ArrowUp=0x91
ArrowDown=0x11
ArrowLeft=0x9D
ArrowRight=0x1D

# Screen control
Enter=0x0D
Backspace=0x14
Delete=0x14
Insert=0x94
Shift+Insert=0x94
Home=0x13
Shift+Home=0x93
Escape=0x03

# Toggle text/graphics mode
Ctrl+Meta=0x0E,0x8E

# CBM (Alt) graphics mappings (derived from doc/c64/c64-petscii-codes.csv)
# Notes:
# - Some PETSCII bytes share the same C64 key+modifier depending on C64 text/graphics mode.
#   For those ambiguous cases, we map the lowest PETSCII code listed in the CSV.
Alt+KeyK=0xA1
Alt+KeyA=0xA2
Alt+KeyT=0xA3
# CBM+@ (0xA4): On DE, @ is AltGr+KeyQ. Using Shift+Alt+KeyQ as locale-correct code.
Shift+Alt+KeyQ=0xA4
Alt+KeyG=0xA5
# CBM++ (0xA6): On DE, + is on Backslash key (level 1). Alt+Backslash maps to the + key.
Alt+Backslash=0xA6
Alt+KeyN=0xA7
# CBM+£ (0xA8): £ is barely reachable on DE (AltGr+Shift+Digit3). Keep as positional
# fallback via Alt+£ text+modifier (multi-byte, no normalization conflict).
Alt+£=0xA8
Alt+KeyQ=0xAB
Alt+KeyD=0xAC
Alt+KeyZ=0xAD
Alt+KeyS=0xAE
Alt+KeyP=0xAF
Alt+KeyE=0xB1
Alt+KeyR=0xB2
Alt+KeyW=0xB3
Alt+KeyJ=0xB5
Alt+KeyL=0xB6
Alt+KeyY=0xB7
Alt+KeyU=0xB8
Alt+KeyO=0xB9
Alt+KeyF=0xBB
Alt+KeyC=0xBC
Alt+KeyX=0xBD
Alt+KeyV=0xBE
Alt+KeyB=0xBF
Alt+KeyI=0xE2
Alt+KeyH=0xE5
# CBM+- (0xDC): On DE, - is on the Slash key. Alt+Slash maps correctly.
Alt+Slash=0xDC
# CBM+* (0xDF): On DE, * is Shift+Backslash. Shift+Alt+Backslash maps correctly.
Shift+Alt+Backslash=0xDF

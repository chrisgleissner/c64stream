# C64 Symbolic Italian Keymap
# Based on symbolic_us with Italian-specific additions only.

[meta]
name=Symbolic IT
description=Symbolic mapping for Italian (IT) keyboards (text-first)
language=it
type=symbolic

[map]
# Lowercase letters
a=0x41
b=0x42
c=0x43
d=0x44
e=0x45
f=0x46
g=0x47
h=0x48
i=0x49
j=0x4A
k=0x4B
l=0x4C
m=0x4D
n=0x4E
o=0x4F
p=0x50
q=0x51
r=0x52
s=0x53
t=0x54
u=0x55
v=0x56
w=0x57
x=0x58
y=0x59
z=0x5A

# Uppercase letters
A=0xC1
B=0xC2
C=0xC3
D=0xC4
E=0xC5
F=0xC6
G=0xC7
H=0xC8
I=0xC9
J=0xCA
K=0xCB
L=0xCC
M=0xCD
N=0xCE
O=0xCF
P=0xD0
Q=0xD1
R=0xD2
S=0xD3
T=0xD4
U=0xD5
V=0xD6
W=0xD7
X=0xD8
Y=0xD9
Z=0xDA

# Numbers
0=0x30
1=0x31
2=0x32
3=0x33
4=0x34
5=0x35
6=0x36
7=0x37
8=0x38
9=0x39

# Special characters
space=0x20
!=0x21
"=0x22
#=0x23
$=0x24
Shift+4=0x24
%=0x25
&=0x26
'=0x27
(=0x28
)=0x29
*=0x2A
+=0x2B
,=0x2C
-=0x2D
.=0x2E
/=0x2F
:=0x3A
;=0x3B
<=0x3C
==0x3D
>=0x3E
?=0x3F
@=0x40
[=0x5B
]=0x5D
^=0x5E
`=0x5F

# Locale-specific additions (differences vs Symbolic US)
à=0x41
è=0x45
é=0x45
ì=0x49
ò=0x4F
ù=0x55

# Control characters
Ctrl+a=0x01
Ctrl+b=0x02
Ctrl+c=0x03
Ctrl+d=0x04
Ctrl+e=0x05
Ctrl+f=0x06
Ctrl+g=0x07
Ctrl+h=0x08
Ctrl+i=0x09
Ctrl+j=0x0A
Ctrl+k=0x0B
Ctrl+l=0x0C
Ctrl+m=0x0D
Ctrl+n=0x0E
Ctrl+o=0x0F
Ctrl+p=0x10
Ctrl+q=0x11
Ctrl+r=0x12
Ctrl+s=0x13
Ctrl+t=0x14
Ctrl+u=0x15
Ctrl+v=0x16
Ctrl+w=0x17
Ctrl+x=0x18
Ctrl+y=0x19
Ctrl+z=0x1A

# Color codes
Ctrl+1=0x90
Ctrl+2=0x05
Ctrl+3=0x1C
Ctrl+4=0x9F
Ctrl+5=0x9C
Ctrl+6=0x1E
Ctrl+7=0x1F
Ctrl+8=0x9E
Ctrl+9=0x12
Ctrl+0=0x92

# Color codes (CBM / Alt+number)
# On a real C64: Ctrl+1..8 selects colors 0..7, CBM+1..8 selects colors 8..15.
Alt+1=0x81
Alt+2=0x95
Alt+3=0x96
Alt+4=0x97
Alt+5=0x98
Alt+6=0x99
Alt+7=0x9A
Alt+8=0x9B

# Function keys
f1=0x85
f2=0x89
f3=0x86
f4=0x8A
f5=0x87
f6=0x8B
f7=0x88
f8=0x8C

# Cursor movement
up=0x91
down=0x11
left=0x9D
right=0x1D

# Screen control
return=0x0D
enter=0x0D
backspace=0x14
delete=0x14
insert=0x94
Shift+insert=0x94
home=0x13
Shift+home=0x93
clear=0x93
esc=0x03

# CBM (Alt) graphics mappings (derived from doc/c64/c64-petscii-codes.csv)
# Notes:
# - Some PETSCII bytes share the same C64 key+modifier depending on C64 text/graphics mode.
#   For those ambiguous cases, we map the lowest PETSCII code listed in the CSV.
Alt+k=0xA1
Alt+i=0xA2
Alt+t=0xA3
Shift+Alt+@=0xA4
Alt+g=0xA5
Shift+Alt++=0xA6
Alt+n=0xA7
Alt+£=0xA8
Alt+q=0xAB
Alt+d=0xAC
Alt+z=0xAD
Alt+s=0xAE
Alt+p=0xAF
Alt+a=0xB0
Alt+e=0xB1
Alt+r=0xB2
Alt+w=0xB3
Alt+j=0xB5
Alt+l=0xB6
Alt+y=0xB7
Alt+u=0xB8
Alt+o=0xB9
Alt+f=0xBB
Alt+c=0xBC
Alt+x=0xBD
Alt+v=0xBE
Alt+b=0xBF
Alt+m=0xCD
Alt+h=0xD4
Alt+-=0xDC
Shift+Alt+*=0xDF

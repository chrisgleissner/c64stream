# C64 Symbolic US Keymap
# Maps keyboard input to PETSCII/symbolic C64 key names
# Format: key=value where value can be:
#   - PETSCII code (decimal or 0xHH hex)
#   - Symbolic name (c64:NAME for special keys)
#   - ASCII character (for direct mapping)

[meta]
name=Symbolic US
description=Symbolic mapping for US keyboards (text-first)
version=1.0
author=C64 Stream

[map]
# Lowercase letters → PETSCII lowercase (0x41-0x5A = A-Z)
a=0x41
b=0x42
c=0x43
d=0x44
e=0x45
f=0x46
g=0x47
h=0x48
i=0x49
j=0x4A
k=0x4B
l=0x4C
m=0x4D
n=0x4E
o=0x4F
p=0x50
q=0x51
r=0x52
s=0x53
t=0x54
u=0x55
v=0x56
w=0x57
x=0x58
y=0x59
z=0x5A

# Uppercase letters → PETSCII graphics chars (0xC1-0xDA)
A=0xC1
B=0xC2
C=0xC3
D=0xC4
E=0xC5
F=0xC6
G=0xC7
H=0xC8
I=0xC9
J=0xCA
K=0xCB
L=0xCC
M=0xCD
N=0xCE
O=0xCF
P=0xD0
Q=0xD1
R=0xD2
S=0xD3
T=0xD4
U=0xD5
V=0xD6
W=0xD7
X=0xD8
Y=0xD9
Z=0xDA

# Numbers
0=0x30
1=0x31
2=0x32
3=0x33
4=0x34
5=0x35
6=0x36
7=0x37
8=0x38
9=0x39

# Special characters
space=0x20
!=0x21
"=0x22
#=0x23
$=0x24
%=0x25
&=0x26
'=0x27
(=0x28
)=0x29
*=0x2A
+=0x2B
,=0x2C
-=0x2D
.=0x2E
/=0x2F
:=0x3A
;=0x3B
<=0x3C
==0x3D
>=0x3E
?=0x3F
@=0x40
[=0x5B
]=0x5D
^=0x5E

# Control keys (symbolic names)
return=c64:RETURN
esc=c64:RUNSTOP
backspace=c64:INSTDEL
tab=c64:TAB
f1=c64:F1
f3=c64:F3
f5=c64:F5
f7=c64:F7
up=c64:CURSOR_UP
down=c64:CURSOR_DOWN
left=c64:CURSOR_LEFT
right=c64:CURSOR_RIGHT
home=c64:HOME
clear=c64:CLEAR

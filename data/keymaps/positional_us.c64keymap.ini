# C64 Positional (US) Keymap
# Maps keyboard by physical position (layout-independent)
# Uses W3C KeyboardEvent.code names
# Format: key=value where value can be:
#   - PETSCII code (decimal or 0xHH hex)
#   - Symbolic name (c64:NAME for special keys)

[meta]
name=Positional (US)
description=Physical position mapping for US keyboard layout
type=positional
fallback=none
version=1.0
author=C64 Stream

[map]
# Number row
Digit1=0x31
Digit2=0x32
Digit3=0x33
Digit4=0x34
Digit5=0x35
Digit6=0x36
Digit7=0x37
Digit8=0x38
Digit9=0x39
Digit0=0x30

# Top letter row (QWERTY)
KeyQ=0x51
KeyW=0x57
KeyE=0x45
KeyR=0x52
KeyT=0x54
KeyY=0x59
KeyU=0x55
KeyI=0x49
KeyO=0x4F
KeyP=0x50

# Home row (ASDF...)
KeyA=0x41
KeyS=0x53
KeyD=0x44
KeyF=0x46
KeyG=0x47
KeyH=0x48
KeyJ=0x4A
KeyK=0x4B
KeyL=0x4C

# Bottom row (ZXCV...)
KeyZ=0x5A
KeyX=0x58
KeyC=0x43
KeyV=0x56
KeyB=0x42
KeyN=0x4E
KeyM=0x4D

# Special characters
Space=0x20
Comma=0x2C
Period=0x2E
Slash=0x2F
Semicolon=0x3B
Quote=0x27
BracketLeft=0x5B
BracketRight=0x5D
Backslash=0x5C
Minus=0x2D
Equal=0x3D
Backquote=0x60

# Shifted characters (use PETSCII shift equivalents)
Shift+Digit1=0x21
Shift+Digit2=0x22
Shift+Digit3=0x23
Shift+Digit4=0x24
Shift+Digit5=0x25
Shift+Digit6=0x26
Shift+Digit7=0x27
Shift+Digit8=0x28
Shift+Digit9=0x29
Shift+Digit0=0x30

# Control/function keys
Enter=c64:RETURN
Backspace=c64:INSTDEL
Tab=c64:TAB
ArrowUp=c64:CURSOR_UP
ArrowDown=c64:CURSOR_DOWN
ArrowLeft=c64:CURSOR_LEFT
ArrowRight=c64:CURSOR_RIGHT
Home=c64:HOME
Delete=c64:INSTDEL
Insert=c64:INSERT

# Function keys
F1=c64:F1
F2=c64:F2
F3=c64:F3
F4=c64:F4
F5=c64:F5
F6=c64:F6
F7=c64:F7
F8=c64:F8

# Special C64 keys
Pause=c64:RUNSTOP
End=c64:CLEAR

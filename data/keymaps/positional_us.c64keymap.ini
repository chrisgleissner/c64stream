# C64 Positional (US) Keymap
# Maps keyboard by physical position (layout-independent)
# Uses W3C KeyboardEvent.code names
# Format: key=value where value can be:
#   - PETSCII code (decimal or 0xHH hex)
#   - Symbolic name (c64:NAME for special keys)

[meta]
name=Positional (US)
description=Physical position mapping for US keyboard layout
type=positional

[map]
# Number row
Digit1=0x31
Digit2=0x32
Digit3=0x33
Digit4=0x34
Digit5=0x35
Digit6=0x36
Digit7=0x37
Digit8=0x38
Digit9=0x39
Digit0=0x30

# Top letter row (QWERTY)
KeyQ=0x51
KeyW=0x57
KeyE=0x45
KeyR=0x52
KeyT=0x54
KeyY=0x59
KeyU=0x55
KeyI=0x49
KeyO=0x4F
KeyP=0x50

# Home row (ASDF...)
KeyA=0x41
KeyS=0x53
KeyD=0x44
KeyF=0x46
KeyG=0x47
KeyH=0x48
KeyJ=0x4A
KeyK=0x4B
KeyL=0x4C

# Shifted letters (derived from doc/c64u/c64-petscii-codes.csv)
Shift+KeyA=0xC1
Shift+KeyB=0xC2
Shift+KeyC=0xC3
Shift+KeyD=0xC4
Shift+KeyE=0xC5
Shift+KeyF=0xC6
Shift+KeyG=0xC7
Shift+KeyH=0xC8
Shift+KeyI=0xC9
Shift+KeyJ=0xCA
Shift+KeyK=0xCB
Shift+KeyL=0xCC
Shift+KeyM=0xCD
Shift+KeyN=0xCE
Shift+KeyO=0xCF
Shift+KeyP=0xD0
Shift+KeyQ=0xD1
Shift+KeyR=0xD2
Shift+KeyS=0xD3
Shift+KeyT=0xD4
Shift+KeyU=0xD5
Shift+KeyV=0xD6
Shift+KeyW=0xD7
Shift+KeyX=0xD8
Shift+KeyY=0xD9
Shift+KeyZ=0xDA

# Bottom row (ZXCV...)
KeyZ=0x5A
KeyX=0x58
KeyC=0x43
KeyV=0x56
KeyB=0x42
KeyN=0x4E
KeyM=0x4D

# Special characters
Space=0x20
Shift+Space=0xA0
Comma=0x2C
Period=0x2E
Slash=0x2F
Semicolon=0x3B
Quote=0x27
BracketLeft=0x5B
BracketRight=0x5D
Backslash=0x5C
Minus=0x2D
Equal=0x3D
Backquote=0x60

# Shifted punctuation
Shift+Comma=0x3C
Shift+Period=0x3E
Shift+Slash=0x3F
Shift+Semicolon=0x3A
Shift+Quote=0x22
Shift+Equal=0x2B

# CBM (Alt) graphics mappings (derived from doc/c64u/c64-petscii-codes.csv)
# Notes:
# - Some PETSCII bytes share the same C64 key+modifier depending on C64 text/graphics mode.
#   For those ambiguous cases, we map the lowest PETSCII code listed in the CSV.
Alt+KeyK=0xA1
Alt+KeyA=0xA2
Alt+KeyT=0xA3
Shift+Alt+Digit2=0xA4
Alt+KeyG=0xA5
Shift+Alt+Equal=0xA6
Alt+KeyN=0xA7
Alt+Backslash=0xA8
Alt+KeyQ=0xAB
Alt+KeyD=0xAC
Alt+KeyZ=0xAD
Alt+KeyS=0xAE
Alt+KeyP=0xAF
Alt+KeyE=0xB1
Alt+KeyR=0xB2
Alt+KeyW=0xB3
Alt+KeyJ=0xB5
Alt+KeyL=0xB6
Alt+KeyY=0xB7
Alt+KeyU=0xB8
Alt+KeyO=0xB9
Alt+KeyF=0xBB
Alt+KeyC=0xBC
Alt+KeyX=0xBD
Alt+KeyV=0xBE
Alt+KeyB=0xBF
Alt+Minus=0xDC
Shift+Alt+Digit8=0xDF

# Shifted characters (use PETSCII shift equivalents)
Shift+Digit1=0x21
Shift+Digit2=0x40
Shift+Digit3=0x23
Shift+Digit4=0x24
Shift+Digit5=0x25
Shift+Digit6=0x26
Shift+Digit7=0x27
Shift+Digit8=0x28
Shift+Digit9=0x29
Shift+Digit0=0x30

# Control characters (Ctrl+key)
Ctrl+KeyA=0x01
Ctrl+KeyB=0x02
Ctrl+KeyC=0x03
Ctrl+KeyD=0x04
Ctrl+KeyE=0x05
Ctrl+KeyF=0x06
Ctrl+KeyG=0x07
Ctrl+KeyH=0x08
Ctrl+KeyI=0x09
Ctrl+KeyJ=0x0A
Ctrl+KeyK=0x0B
Ctrl+KeyL=0x0C
Ctrl+KeyM=0x0D
Ctrl+KeyN=0x0E
Ctrl+KeyO=0x0F
Ctrl+KeyP=0x10
Ctrl+KeyQ=0x11
Ctrl+KeyR=0x12
Ctrl+KeyS=0x13
Ctrl+KeyT=0x14
Ctrl+KeyU=0x15
Ctrl+KeyV=0x16
Ctrl+KeyW=0x17
Ctrl+KeyX=0x18
Ctrl+KeyY=0x19
Ctrl+KeyZ=0x1A

# Color codes (Ctrl+number)
Ctrl+Digit1=0x90
Ctrl+Digit2=0x05
Ctrl+Digit3=0x1C
Ctrl+Digit4=0x9F
Ctrl+Digit5=0x9C
Ctrl+Digit6=0x1E
Ctrl+Digit7=0x1F
Ctrl+Digit8=0x9E
Ctrl+Digit9=0x12
Ctrl+Digit0=0x92

# Control/function keys
Enter=0x0D
Backspace=0x14
Tab=0x09
ArrowUp=0x91
ArrowDown=0x11
ArrowLeft=0x9D
ArrowRight=0x1D
Home=0x13
Delete=0x14
Insert=0x94
End=0x93
Escape=0x03

# Function keys (PETSCII codes)
F1=0x85
F2=0x89
F3=0x86
F4=0x8A
F5=0x87
F6=0x8B
F7=0x88
F8=0x8C

# Special C64 keys
Pause=0x03

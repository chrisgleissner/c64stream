name: NTSC Preserve Scanlines
format: NTSC
preset: Default
pattern: solid
overrides:
  preserve_size: true
  scan_line_distance: 1.0
  scan_line_strength: 0.5
  pixel_width: 1.0
  pixel_height: 1.0
  blur_strength: 0.0
  bloom_strength: 0.0
  afterglow_duration_ms: 0
  afterglow_curve: 0
  tint_mode: 0
  tint_strength: 1.0
assertions:
  - frame_progression
  - video_quality
  - audio
  - scanlines
  - bounds_stability

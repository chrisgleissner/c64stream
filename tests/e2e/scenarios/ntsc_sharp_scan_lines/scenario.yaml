# C64 Stream - E2E Scenario: NTSC Sharp Scan Lines
#
# Purpose: validate pixel-perfect scanline rendering without any intentional blur/bloom/afterglow.
# This scenario is intended to catch OBS scaling/interpolation issues.
#
# Note: scan_line_strength is set to 0.5 (not 1.0) to ensure sufficient visible content
# for video quality validation. With 1.0, the scanlines make ~50% of rows completely black,
# leaving insufficient content for the assertions to verify.
#
# Uses 'solid' pattern (light blue fill) for clearer scanline visibility compared to
# 'diagonal' which has mostly black areas between thin colored stripes.

name: NTSC Sharp Scan Lines
format: NTSC
preset: Default
pattern: solid

# Override effect settings for a crisp scanline signal.
overrides:
  scan_line_distance: 1.0
  scan_line_strength: 0.5
  pixel_width: 1.0
  pixel_height: 1.0
  blur_strength: 0.0
  bloom_strength: 0.0
  afterglow_duration_ms: 0
  afterglow_curve: 0
  tint_mode: 0
  tint_strength: 1.0

assertions:
  - frame_progression
  - video_quality
  - audio
  - scanlines

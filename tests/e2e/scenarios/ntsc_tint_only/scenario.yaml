name: NTSC Tint Only
format: NTSC
assertions:
  - video_quality
  - audio
  - tint
  - frame_progression

# Override effect settings (only tint enabled)
effect_overrides:
  scan_line_distance: 0.0
  scan_line_strength: 0.0
  blur_strength: 0.0
  bloom_strength: 0.0
  pixel_width: 1.0
  pixel_height: 1.0
  tint_mode: 2
  tint_strength: 1.0
  afterglow_duration_ms: 0

name: NTSC Effects Green Monitor
format: NTSC
preset: Green Monitor
packet_source: media
assertions:
  - video_quality
  - audio
  - tint
  - afterglow
  - scanlines
  - frame_progression
tolerances:
  frame_progression:
    local: 1.0
    ci: 0.6
  video_quality:
    local: 0.88  # Media source has some preamble bleed (44% non-black observed)
    ci: 0.6
  afterglow:
    local: 0.5  # More lenient - green tint causes brightness variation
    ci: 0.6

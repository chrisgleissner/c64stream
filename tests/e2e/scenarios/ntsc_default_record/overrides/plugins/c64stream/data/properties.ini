# C64 Stream Plugin Configuration Override for ntsc_default_record scenario
# This enables all recording options

[recording]
record_video=true
record_audio=true
record_obs=true
record_network=true
record_csv=true
record_frames=true

[network]
c64_host=localhost
dns_server_ip=127.0.0.1
video_port=21000
audio_port=21001
control_port=6400
auto_detect_ip=false
buffer_delay_ms=10
debug_logging=true

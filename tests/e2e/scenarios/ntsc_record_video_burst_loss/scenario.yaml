# C64CLK-006: reproduce review.md §3.3 — periodic video-only outages (1,500ms
# every 3s) with ZERO audio loss. Pre-fix: audio can only leave the delay
# buffer alongside a video pop, so each video stall exceeds the documented
# 275-packet / ~1.1s audio ring, producing a packet-timeline hole and
# clicks/holes in the recording despite perfect audio delivery. Post-fix
# (C64CLK-004): audio drains independently of video and stays clean.
# The original plan proposed 400ms, but that cannot fill a ~1.1s ring (only
# ~100 audio packets arrive); 1,500ms is the smallest comfortably reproducible
# outage and strengthens rather than relaxes the acceptance threshold.
name: NTSC Record Video Burst Loss
format: NTSC
preset: Default
duration: 12
disable_pops: true
skip_frame_logic_validation: true
overrides:
  record_video: true
  record_audio: true
  buffer_delay_ms: 10
network_simulation:
  seed: 64
  burst_loss_ms: 1500
  burst_loss_interval_ms: 3000
  burst_loss_stream: video
  audio_packet_set: sine1k
assertions:
  - record_audio_quality
  - log_hygiene

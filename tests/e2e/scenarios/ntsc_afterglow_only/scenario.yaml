name: NTSC Afterglow Only
format: NTSC
assertions:
  - video_quality
  - audio
  - afterglow
  - frame_progression

# Override effect settings (all disabled except afterglow)
effect_overrides:
  scan_line_distance: 0.0
  scan_line_strength: 0.0
  blur_strength: 0.0
  bloom_strength: 0.0
  tint_mode: 0
  afterglow_duration_ms: 40
  afterglow_curve: 3

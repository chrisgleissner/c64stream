name: NTSC Long Buffer Delay (500ms) with Network Simulation
format: NTSC
preset: Default
overrides:
  buffer_delay_ms: 500
network_simulation:
  jitter_percent: 20
  reorder_percent: 30
  reorder_max_delay_ms: 400  # Max delay: 400ms (within 500ms buffer window)
assertions:
  - frame_progression
  - video_quality
  - audio

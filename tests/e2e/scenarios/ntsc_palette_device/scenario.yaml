name: NTSC Device Palette
format: NTSC
preset: Default
mock_rest_enabled: true
overrides:
  c64_host: 127.0.0.1
  video_port: 11000
  audio_port: 11001
  stream_control_transport: 1
  palette: __device__
  device_palette_before_expected: Default
  device_palette_expected: vibrant
  device_palette_transition_fraction: 0.72
  debug_logging: true
network_simulation:
  runtime_palette_vpl: vibrant
  runtime_palette_delay_ms: 4000
  expected_palette_requests: [true]
assertions:
  - video_quality
  - audio
  - frame_progression
  - palette_mapping

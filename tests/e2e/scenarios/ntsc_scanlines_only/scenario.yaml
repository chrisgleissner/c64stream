name: NTSC Scanlines Only
format: NTSC
assertions:
  - video_quality
  - audio
  - scanlines
  - frame_progression

# Override effect settings (only scanlines enabled)
effect_overrides:
  scan_line_distance: 0.5
  scan_line_strength: 0.5
  blur_strength: 0.0
  bloom_strength: 0.0
  tint_mode: 0
  afterglow_duration_ms: 0

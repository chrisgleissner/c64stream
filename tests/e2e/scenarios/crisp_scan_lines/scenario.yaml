# C64 Stream - E2E Scenario: Crisp Scan Lines
#
# Purpose: validate pixel-perfect scanline rendering without any intentional blur/bloom/afterglow.
# This scenario is intended to catch OBS scaling/interpolation issues.

name: Crisp Scan Lines
format: PAL
preset: Default
pattern: solid

# Override effect settings for a crisp scanline signal.
overrides:
  scan_line_distance: 1.0
  scan_line_strength: 1.0
  pixel_width: 1.0
  pixel_height: 1.0
  blur_strength: 0.0
  bloom_strength: 0.0
  afterglow_duration_ms: 0
  afterglow_curve: 0
  tint_mode: 0
  tint_strength: 1.0

assertions:
  - video_quality
  - audio
  - scanlines

# C64 Stream Plugin Configuration - Scanline E2E Testing
#
# Tests scanline rendering with Arcade Cabinet preset settings
#

[network]
c64_host=localhost
control_port=6400
dns_server_ip=127.0.0.1
video_port=21000
audio_port=21001
# CRITICAL for E2E: use localhost instead of auto-detected IP
auto_detect_ip=false
obs_ip_address=127.0.0.1
buffer_delay_ms=10

[recording]
save_folder=
save_frames=false
record_video=false
record_csv=false

[ci]
is_ci=false

[debug]
debug_logging=true

[effects]
# Arcade Cabinet preset - scanlines enabled
scan_line_distance=1.0
scan_line_strength=0.7
pixel_width=1.0
pixel_height=1.0
blur_strength=0.0
bloom_strength=0.0
afterglow_duration_ms=0
afterglow_curve=0
tint_mode=0
tint_strength=0.0

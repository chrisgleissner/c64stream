name: NTSC Vintage TV
format: NTSC
preset: Vintage TV

# Vintage TV has demanding CRT effects (blur=0.8, bloom=0.5, scanlines, afterglow).

assertions:
  - frame_progression
  - video_quality
  - audio

tolerances:
  frame_progression:
    local: 1.0
    ci: 0.4
  av_sync:
    ci: lenient  # Heavy CRT effects can cause pop detection issues on CI

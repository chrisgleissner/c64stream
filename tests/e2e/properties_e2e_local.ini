# C64 Stream Plugin Configuration - Local E2E Testing
#
# This configuration file is used specifically for local end-to-end testing.
# It configures the plugin to connect to localhost instead of a real C64 Ultimate device.
#

[network]
# Use localhost for E2E testing - the test will act as a mock C64 Ultimate
c64_host=localhost

# Control port for mock C64 Ultimate TCP server (non-privileged for testing)
control_port=6400

# Default DNS server for hostname resolution
dns_server_ip=127.0.0.1

# E2E-specific UDP ports to avoid conflicts with real C64 Ultimate devices
video_port=21000
audio_port=21001

# Whether to auto-detect OBS machine IP address
auto_detect_ip=false

# OBS machine IP address for E2E testing (use localhost)
obs_ip_address=127.0.0.1

# Default buffer delay in milliseconds
buffer_delay_ms=10

[recording]
# Default output folder for recordings (platform-specific paths will be used if empty)
save_folder=

# Enable CSV recording for E2E testing to track UDP packets and plugin events
save_frames=false
record_video=false
record_csv=true

[ci]
# Local environment - do not force CI behavior
is_ci=false

[debug]
# Enable debug logging by default for E2E testing
debug_logging=true

[effects]
# Default CRT effect values - baseline E2E test uses no effects for deterministic A/V sync
scan_line_distance=0.0
scan_line_strength=0.0
afterglow_duration_ms=0
afterglow_curve=0

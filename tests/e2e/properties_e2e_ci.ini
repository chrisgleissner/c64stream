# C64 Stream Plugin Configuration - CI E2E Testing
#
# This configuration file is used specifically for CI end-to-end testing.
# It includes CI-specific optimizations and resource-constrained environment settings.
#

[network]
# Use localhost for CI E2E testing - GitHub Actions will act as a mock C64 Ultimate
c64_host=localhost

# Control port for mock C64 Ultimate TCP server (non-privileged for CI)
control_port=6400

# Default DNS server for hostname resolution in CI
dns_server_ip=127.0.0.1

# Default UDP ports for video and audio streams
video_port=11000
audio_port=11001

# Whether to auto-detect OBS machine IP address
auto_detect_ip=false

# OBS machine IP address for CI testing (use localhost)
obs_ip_address=127.0.0.1

# Buffer delay for CI performance vs reliability balance
buffer_delay_ms=25

[recording]
# Default output folder for recordings (platform-specific paths will be used if empty)
save_folder=

# Enable CSV recording for CI testing to track UDP packets and plugin events
record_frames=false
record_video=false
record_csv=true

[ci]
# CI environment - enable CI-specific behaviors
is_ci=true

[debug]
# Enable debug logging for CI testing and troubleshooting
debug_logging=true

[effects]
# Default CRT effect values (disabled for CI performance)
scan_line_distance=0.0
scan_line_strength=0.0

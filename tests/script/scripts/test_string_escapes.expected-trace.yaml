program: |
  01: rem Test string escape sequences
  02: rem Covers doubled quotes, backslashes, tabs, and hex escapes
  03: 
  04: QUOTE$ = "He said ""RUN""."
  05: QUOTE_LEN = LEN(QUOTE$)
  06: QUOTE_MARK = ASC(MID$(QUOTE$, 9, 1))
  07: 
  08: PATH$ = "C:\\Temp\\file.txt"
  09: PATH_SLASH = ASC(MID$(PATH$, 3, 1))
  10: 
  11: TAB$ = "Tab:\tX"
  12: TAB_CODE = ASC(MID$(TAB$, 5, 1))
  13: TAB_LEN = LEN(TAB$)
  14: 
  15: HEX$ = "Hex:\x41\x42"
  16: HEX_A = ASC(MID$(HEX$, 5, 1))
  17: HEX_B = ASC(MID$(HEX$, 6, 1))
  18: 
  19: WAIT 0.1 s
  20: WAIT UNTIL 0
  21: 
  22: if QUOTE_LEN = 14 and QUOTE_MARK = 34 then
  23:     effect "Sharp Pixels"
  24: endif
  25: 
  26: if PATH_SLASH = 92 then
  27:     palette "colodore"
  28: endif
  29: 
  30: if TAB_CODE = 9 and TAB_LEN = 6 then
  31:     palette "pepto_ntsc"
  32: endif
  33: 
  34: if HEX_A = 65 and HEX_B = 66 then
  35:     effect "Soft CRT"
  36: endif
  37: 
  38: stop

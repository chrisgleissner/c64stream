program: |
  001: rem Test built-in functions
  002: rem Validates string, math, and utility functions
  003: 
  004: rem Test 1: String functions - LEFT$
  005: TEXT$ = "HELLO WORLD"
  006: PREFIX$ = LEFT$(TEXT$, 5)
  007: LOG "Left 5: " + PREFIX$
  008: wait 100ms
  009: 
  010: rem Test 2: String functions - RIGHT$
  011: SUFFIX$ = RIGHT$(TEXT$, 5)
  012: LOG "Right 5: " + SUFFIX$
  013: wait 100ms
  014: 
  015: rem Test 3: String functions - MID$
  016: MIDDLE$ = MID$(TEXT$, 7, 5)
  017: LOG "Middle: " + MIDDLE$
  018: wait 100ms
  019: 
  020: rem Test 4: String functions - LEN
  021: LENGTH = LEN(TEXT$)
  022: LOG "Length: " + LENGTH
  023: wait 100ms
  024: 
  025: rem Test 5: String functions - CHR$
  026: CHAR_A$ = CHR$(65)
  027: LOG "CHR$(65): " + CHAR_A$
  028: wait 100ms
  029: 
  030: rem Test 6: String functions - ASC
  031: CODE = ASC("A")
  032: LOG "ASC(A): " + CODE
  033: wait 100ms
  034: 
  035: rem Test 7: Conversion functions - STR$
  036: NUM = 42
  037: NUM_STR$ = STR$(NUM)
  038: LOG "STR$(42): " + NUM_STR$
  039: wait 100ms
  040: 
  041: rem Test 8: Conversion functions - VAL
  042: STR_NUM$ = "123.45"
  043: PARSED = VAL(STR_NUM$)
  044: LOG "VAL(123.45): " + PARSED
  045: wait 100ms
  046: 
  047: rem Test 9: Math functions - ABS
  048: NEG = -42
  049: POS = ABS(NEG)
  050: LOG "ABS(-42): " + POS
  051: wait 100ms
  052: 
  053: rem Test 10: Math functions - INT
  054: FLOAT = 3.7
  055: INTEGER = INT(FLOAT)
  056: LOG "INT(3.7): " + INTEGER
  057: wait 100ms
  058: 
  059: rem Test 11: Math functions - RND
  060: RANDOM = RND(100)
  061: LOG "RND(100): " + RANDOM
  062: wait 100ms
  063: 
  064: rem Test 12: Math functions - SIN
  065: ANGLE = 1.5708
  066: SINE = SIN(ANGLE)
  067: LOG "SIN(pi/2): " + SINE
  068: wait 100ms
  069: 
  070: rem Test 13: Math functions - COS
  071: COSINE = COS(0)
  072: LOG "COS(0): " + COSINE
  073: wait 100ms
  074: 
  075: rem Test 14: Math functions - TAN
  076: TANGENT = TAN(0.785398)
  077: LOG "TAN(pi/4): " + TANGENT
  078: wait 100ms
  079: 
  080: rem Test 15: Math functions - SQRT
  081: SQUARE = 144
  082: ROOT = SQRT(SQUARE)
  083: LOG "SQRT(144): " + ROOT
  084: wait 100ms
  085: 
  086: rem Test 16: Math functions - LOG (natural logarithm)
  087: E_VAL = 2.71828
  088: NAT_LOG = LOG(E_VAL)
  089: LOG "LOG(e): " + NAT_LOG
  090: wait 100ms
  091: 
  092: rem Test 17: Math functions - EXP
  093: POWER = EXP(1)
  094: LOG "EXP(1): " + POWER
  095: wait 100ms
  096: 
  097: rem Test 18: TIME$ function
  098: CURRENT_TIME$ = TIME$()
  099: LOG "Current time: " + CURRENT_TIME$
  100: wait 100ms
  101: 
  102: rem Test 19: Functions in expressions
  103: RESULT = INT(RND(10)) + 1
  104: LOG "Random 1-10: " + RESULT
  105: wait 100ms
  106: 
  107: rem Test 20: Nested function calls
  108: NESTED$ = LEFT$(RIGHT$("ABCDEFGH", 6), 3)
  109: LOG "Nested result: " + NESTED$
  110: wait 100ms
  111: 
  112: rem Test 21: Functions in conditionals
  113: NAME$ = "TEST"
  114: if LEN(NAME$) = 4 then
  115:     effect "Sharp Pixels"
  116: endif
  117: wait 100ms
  118: 
  119: rem Test 22: String manipulation chain
  120: ORIGINAL$ = "  hello world  "
  121: UPPER$ = ORIGINAL$
  122: LENGTH = LEN(UPPER$)
  123: TRIMMED$ = MID$(UPPER$, 3, 11)
  124: LOG "Manipulated: " + TRIMMED$
  125: 
  126: stop

  12:     palette "colodore"
  13:     wait 50ms
  14: next j
  15: rem Should execute 3 times: 0, 2, 4
  16: 
  17: rem Test 3: Backward counting (3 to 1, step -1)
  18: for k = 3 to 1 step -1
  19:     effect "Soft CRT"
  20:     wait 50ms
  21: next k
  22: rem Should execute 3 times
  23: 
  24: rem Test 4: Backward counting with step -2

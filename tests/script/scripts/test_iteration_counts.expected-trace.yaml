  33:     rem This should not execute
  34:     effect "SHOULD_NOT_SEE"
  35: next m
  36: 
  37: rem Test 6: Loop with conditional
  38: count = 0
  39: for n = 1 to 3
  40:     count = count + 1
  41:     if count = 2 then
  42:         effect "Light Scanlines"
  43:         wait 50ms
  44:     endif
  45: next n
  46: 
  47: rem Test 7: Fractional step values
  48: for o = 0 to 1 step 0.5

  56:     for q = 5 to 3 step -1
  57:         effect "CRT Monitor Warm"
  58:         wait 25ms
  59:     next q
  60: next p
  61: rem Outer: 2 times (2,4), Inner: 3 times (5,4,3)
  62: rem Total: 6 executions
  63: 
  64: stop

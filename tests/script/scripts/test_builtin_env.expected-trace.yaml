program: |
  01: REM Test ENV() built-in function
  02: REM Validates reading OS environment variables
  03: 
  04: REM Test 1: Absent variable returns empty string
  05: ABSENT$ = ENV("C64SCRIPT_TEST_ABSENT_VAR_XYZ")
  06: IF ABSENT$ = "" THEN
  07:     LOG "Test 1 passed: absent env var returns empty string"
  08: ELSE
  09:     LOG "Test 1 FAILED: expected empty string, got: " + ABSENT$
  10: ENDIF
  11: 
  12: REM Test 2: Dedicated test env var returns the fixed harness value
  13: PRESENT$ = ENV("C64SCRIPT_TEST_PRESENT_VAR")
  14: IF PRESENT$ = "stable-present-value" THEN
  15:     LOG "Test 2 passed: fixed env var returned expected value"
  16: ELSE
  17:     LOG "Test 2 FAILED: unexpected fixed env var value: " + PRESENT$
  18: ENDIF
  19: 
  20: REM Test 3: VAL() on absent var yields 0
  21: NUM_VAL = VAL(ENV("C64SCRIPT_TEST_ABSENT_VAR_XYZ"))
  22: IF NUM_VAL = 0 THEN
  23:     LOG "Test 3 passed: VAL of absent env var is 0"
  24: ELSE
  25:     LOG "Test 3 FAILED: expected 0, got: " + STR$(NUM_VAL)
  26: ENDIF
  27: 
  28: REM Test 4: Two-arg form returns default when var is absent
  29: DEFAULTED$ = ENV("C64SCRIPT_TEST_ABSENT_VAR_XYZ", "fallback")
  30: IF DEFAULTED$ = "fallback" THEN
  31:     LOG "Test 4 passed: default value used when var absent"
  32: ELSE
  33:     LOG "Test 4 FAILED: expected 'fallback', got: " + DEFAULTED$
  34: ENDIF
  35: 
  36: REM Test 5: Two-arg form ignores default when var is set
  37: DEFAULTED_PRESENT$ = ENV("C64SCRIPT_TEST_PRESENT_VAR", "fallback")
  38: IF DEFAULTED_PRESENT$ = "stable-present-value" THEN
  39:     LOG "Test 5 passed: default not used when var is set"
  40: ELSE
  41:     LOG "Test 5 FAILED: fixed env var via two-arg form returned: " + DEFAULTED_PRESENT$
  42: ENDIF
  43: 
  44: STOP

program: |
  01: REM Test ENV() built-in function
  02: REM Validates reading OS environment variables
  03: 
  04: REM Test 1: Absent variable returns empty string
  05: ABSENT$ = ENV("C64SCRIPT_TEST_ABSENT_VAR_XYZ")
  06: IF ABSENT$ = "" THEN
  07:     LOG "Test 1 passed: absent env var returns empty string"
  08: ELSE
  09:     LOG "Test 1 FAILED: expected empty string, got: " + ABSENT$
  10: ENDIF
  11: 
  12: REM Test 2: Standard env var PATH is set in all environments
  13: IF LEN(ENV("PATH")) > 0 THEN
  14:     LOG "Test 2 passed: PATH is set"
  15: ELSE
  16:     LOG "Test 2 FAILED: PATH was empty"
  17: ENDIF
  18: 
  19: REM Test 3: VAL() on absent var yields 0
  20: NUM_VAL = VAL(ENV("C64SCRIPT_TEST_ABSENT_VAR_XYZ"))
  21: IF NUM_VAL = 0 THEN
  22:     LOG "Test 3 passed: VAL of absent env var is 0"
  23: ELSE
  24:     LOG "Test 3 FAILED: expected 0, got: " + STR$(NUM_VAL)
  25: ENDIF
  26: 
  27: REM Test 4: Two-arg form returns default when var is absent
  28: DEFAULTED$ = ENV("C64SCRIPT_TEST_ABSENT_VAR_XYZ", "fallback")
  29: IF DEFAULTED$ = "fallback" THEN
  30:     LOG "Test 4 passed: default value used when var absent"
  31: ELSE
  32:     LOG "Test 4 FAILED: expected 'fallback', got: " + DEFAULTED$
  33: ENDIF
  34: 
  35: REM Test 5: Two-arg form ignores default when var is set
  36: IF LEN(ENV("PATH", "no-path")) > 0 AND ENV("PATH", "no-path") <> "no-path" THEN
  37:     LOG "Test 5 passed: default not used when var is set"
  38: ELSE
  39:     LOG "Test 5 FAILED: PATH via two-arg form was empty or returned default"
  40: ENDIF
  41: 
  42: STOP

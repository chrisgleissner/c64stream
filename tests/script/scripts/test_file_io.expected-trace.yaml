# Execution trace
script: "test_file_io.c64script"
status: success
error: ~
program: |
  01: rem Test file I/O commands
  02: rem Validates READFILE and WRITEFILE
  03: 
  04: rem Test 1: Write to file with truncate mode
  05: WRITEFILE "test_data.txt", "Hello World" TRUNCATE
  06: wait 100ms
  07: 
  08: rem Test 2: Append to file
  09: WRITEFILE "test_data.txt", "\nLine 2" APPEND
  10: wait 100ms
  11: 
  12: rem Test 3: Write with variable content
  13: MESSAGE$ = "Test message from script"
  14: WRITEFILE "test_data.txt", MESSAGE$ APPEND
  15: wait 100ms
  16: 
  17: rem Test 4: Write numeric value (auto-converted to string)
  18: VALUE = 123.45
  19: WRITEFILE "numbers.txt", VALUE TRUNCATE
  20: wait 100ms
  21: 
  22: rem Test 5: Write in a loop
  23: for I = 1 to 5
  24:     WRITEFILE "loop_output.txt", "Iteration " + I + "\n" APPEND
  25:     wait 50ms
  26: next I
  27: 
  28: rem Test 6: Read from file
  29: READFILE "test_data.txt", CONTENT$
  30: wait 100ms
  31: 
  32: rem Test 7: Use read content
  33: LOG "File content: " + CONTENT$
  34: wait 100ms
  35: 
  36: rem Test 8: Conditional based on file content
  37: READFILE "numbers.txt", NUM_STR$
  38: NUM = VAL(NUM_STR$)
  39: if NUM > 100 then
  40:     effect "Sharp Pixels"
  41: else
  42:     effect "Soft CRT"
  43: endif
  44: wait 100ms
  45: 
  46: rem Test 9: Write configuration
  47: WRITEFILE "config.ini", "host=192.168.1.64\n" TRUNCATE
  48: WRITEFILE "config.ini", "port=8080\n" APPEND
  49: WRITEFILE "config.ini", "timeout=5000\n" APPEND
  50: wait 100ms
  51: 
  52: rem Test 10: Read configuration back
  53: READFILE "config.ini", CONFIG$
  54: LOG "Configuration: " + CONFIG$
  55: 
  56: stop

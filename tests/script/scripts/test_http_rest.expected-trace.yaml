program: |
  01: rem Test HTTP REST API calls
  02: rem Validates HTTP GET, POST, PUT, DELETE, PATCH
  03: 
  04: rem Test 1: HTTP GET request
  05: HTTP GET "http://localhost:8064/v1/version" STATUS STATUS_CODE RESPONSE RESP$
  06: wait 100ms
  07: LOG "GET status: " + STATUS_CODE
  08: 
  09: rem Test 2: HTTP GET with status check
  10: HTTP GET "http://localhost:8064/v1/info" STATUS CODE
  11: if CODE = 200 then
  12:     effect "Sharp Pixels"
  13: endif
  14: wait 100ms
  15: 
  16: rem Test 3: HTTP POST request with body
  17: BODY$ = "{\"command\":\"reset\"}"
  18: HTTP POST "http://localhost:8064/v1/command" BODY BODY$ STATUS POST_STATUS
  19: wait 100ms
  20: 
  21: rem Test 4: HTTP POST with headers and body
  22: HEADERS${"Content-Type"} = "application/json"
  23: DATA$ = "{\"value\":42}"
  24: HTTP POST "http://localhost:8064/v1/data" HEADERS HEADERS$ BODY DATA$ STATUS S RESPONSE R$
  25: wait 100ms
  26: LOG "POST response: " + R$
  27: 
  28: rem Test 5: HTTP PUT request
  29: HTTP PUT "http://localhost:8064/v1/machine:reset" STATUS PUT_CODE
  30: wait 100ms
  31: 
  32: rem Test 6: HTTP DELETE request
  33: HTTP DELETE "http://localhost:8064/v1/resource/123" STATUS DEL_CODE
  34: wait 100ms
  35: 
  36: rem Test 7: HTTP PATCH request
  37: PATCH_BODY$ = "{\"field\":\"updated\"}"
  38: HTTP PATCH "http://localhost:8064/v1/resource/456" BODY PATCH_BODY$ STATUS PATCH_CODE
  39: wait 100ms
  40: 
  41: rem Test 8: HTTP GET in conditional
  42: HTTP GET "http://localhost:8064/v1/status" STATUS API_STATUS RESPONSE API_RESP$
  43: if API_STATUS = 200 then
  44:     LOG "API is available"
  45:     palette "colodore"
  46: else
  47:     LOG "API error: " + API_STATUS
  48:     palette "pepto_ntsc"
  49: endif
  50: wait 100ms
  51: 
  52: rem Test 9: Multiple sequential API calls
  53: for I = 1 to 3
  54:     HTTP GET "http://localhost:8064/v1/version" STATUS S
  55:     LOG "Call " + I + " status: " + S
  56:     wait 50ms
  57: next I
  58: 
  59: rem Test 10: Complex API workflow
  60: HTTP GET "http://localhost:8064/v1/info" STATUS INFO_CODE RESPONSE INFO$
  61: if INFO_CODE = 200 then
  62:     CMD$ = "{\"action\":\"start\"}"
  63:     HTTP POST "http://localhost:8064/v1/command" BODY CMD$ STATUS CMD_CODE
  64:     if CMD_CODE = 200 then
  65:         LOG "Command executed successfully"
  66:     endif
  67: endif
  68: 
  69: stop

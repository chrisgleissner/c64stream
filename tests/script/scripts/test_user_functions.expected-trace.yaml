  099: ENDFUN
  100: 
  101: SOS = SUM_OF_SQUARES(3, 4)
  102: LOG "3^2 + 4^2 = " + STR(SOS)
  103: wait 100ms
  104: 
  105: rem Test 10: Function with effect
  106: FUN APPLY_EFFECT_AND_WAIT(EFFECT_NAME$, DURATION)
  107:     effect EFFECT_NAME$
  108:     wait DURATION
  109:     return 1
  110: ENDFUN

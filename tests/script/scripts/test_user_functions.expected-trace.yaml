  062: wait 100ms
  063: 
  064: rem Test 7: Function with loop
  065: FUN FACTORIAL(N)
  066:     if N <= 1 then
  067:         return 1
  068:     endif
  069:     RESULT = 1
  070:     for I = 2 to N
  071:         RESULT = RESULT * I
  072:     next I
  073:     return RESULT
  074: ENDFUN
  075: 
  076: FACT5 = FACTORIAL(5)
  077: LOG "Factorial(5): " + STR(FACT5)
  078: wait 100ms
  079: 
  080: rem Test 8: Recursive function (careful with depth)
  081: FUN FIB(N)
  082:     if N <= 1 then
  083:         return N
  084:     endif
  085:     return FIB(N - 1) + FIB(N - 2)
  086: ENDFUN
  087: 
  088: FIB5 = FIB(5)
  089: LOG "Fibonacci(5): " + STR(FIB5)
  090: wait 100ms
  091: 
  092: rem Test 9: Function calling another function
  093: FUN SQUARE(X)

  049: wait 100ms
  050: 
  051: rem Test 6: Function with conditional
  052: FUN MAX(A, B)
  053:     if A > B then
  054:         return A
  055:     else
  056:         return B
  057:     endif
  058: ENDFUN
  059: 
  060: MAXIMUM = MAX(15, 10)
